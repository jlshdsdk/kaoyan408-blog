<style>
/* =====================================================================
   研途408 · head-css.css —— 全局样式层
   低饱和深蓝 / 默认暗色(html[data-theme="dark"] 即 :root) / 日间(data-theme="light")
   所有颜色走变量；七科标识色与状态色除外
   ===================================================================== */

/* ---------------- 主题变量 ---------------- */
/* 梵高《星月夜》× 普鲁士蓝：深夜=普鲁士蓝夜空+星芒金；日间=同一色系的昼版 */
:root,
html[data-theme="dark"] {
  --bg: #081222;      --bg2: #0e1e36;     --bg3: #15304f;
  --text: #d9e6f7;    --text2: #7e95b5;   --line: #1f3c63;
  --primary: #3f7cbf; --primary2: rgba(63, 124, 191, 0.16);
  --star: #f0cf6b;    --star2: #ffe9a8;
  --shadow: 0 2px 12px rgba(2, 8, 20, 0.5);
  /* 七科标识色（低饱和，彼此可区分） */
  --c-ds: #6fa3dc;   /* 数据结构 · 群青 */
  --c-comp: #c99a63; /* 组成原理 · 赭 */
  --c-os: #7cbd9b;   /* 操作系统 · 绿 */
  --c-net: #a493d4;  /* 计算机网络 · 紫 */
  --c-math: #d18aa2; /* 数学一 · 玫 */
  --c-eng: #e0bd66;  /* 英语一 · 星金 */
  --c-pol: #93a3b8;  /* 政治 · 灰褐 */
  --ok: #7cbd9b; --warn: #d8a552; --err: #d97a7a;
  color-scheme: dark;
}

html[data-theme="light"] {
  --bg: #edf2f8;      --bg2: #ffffff;     --bg3: #e2eaf3;
  --text: #1b2b40;    --text2: #5d7188;   --line: #cdd9e7;
  --primary: #0d3b63; --primary2: rgba(13, 59, 99, 0.08);
  --star: #b8860b;    --star2: #8a6a14;
  --shadow: 0 2px 10px rgba(20, 45, 80, 0.10);
  --c-ds: #2e6ca8; --c-comp: #8f5f2e; --c-os: #3f7d5c; --c-net: #6b57a3;
  --c-math: #a04e68; --c-eng: #8f6f1c; --c-pol: #5f7286;
  --ok: #3f7d5c; --warn: #a5711f; --err: #ad4d4d;
  color-scheme: light;
}

/* ---------------- 基础重置 ---------------- */
* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; }

body {
  font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 14px; line-height: 1.6;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ---------------- 星月夜 · 纯 CSS 星野与涡旋 ---------------- */
html[data-theme="dark"] body {
  background:
    /* 星芒：大小不一的亮点，少量带星金 */
    radial-gradient(2px 2px at 12% 14%, rgba(255, 244, 214, 0.9), transparent 60%),
    radial-gradient(1.6px 1.6px at 28% 38%, rgba(255, 255, 255, 0.55), transparent 60%),
    radial-gradient(1.4px 1.4px at 41% 8%, rgba(214, 231, 255, 0.7), transparent 60%),
    radial-gradient(1.8px 1.8px at 55% 30%, rgba(255, 244, 214, 0.5), transparent 60%),
    radial-gradient(1.3px 1.3px at 64% 55%, rgba(255, 255, 255, 0.4), transparent 60%),
    radial-gradient(2.2px 2.2px at 76% 16%, rgba(240, 207, 107, 0.9), transparent 60%),
    radial-gradient(1.4px 1.4px at 86% 44%, rgba(255, 255, 255, 0.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 62%, rgba(214, 231, 255, 0.5), transparent 60%),
    radial-gradient(1.6px 1.6px at 33% 76%, rgba(255, 255, 255, 0.35), transparent 60%),
    radial-gradient(1.7px 1.7px at 58% 84%, rgba(240, 207, 107, 0.5), transparent 60%),
    radial-gradient(1.2px 1.2px at 92% 72%, rgba(255, 255, 255, 0.4), transparent 60%),
    /* 星月夜式涡旋：几道极淡的圆环笔触 */
    radial-gradient(circle at 18% 85%, transparent 88px, rgba(120, 170, 220, 0.05) 89px 98px, transparent 99px),
    radial-gradient(circle at 30% 60%, transparent 58px, rgba(120, 170, 220, 0.045) 59px 66px, transparent 67px),
    radial-gradient(circle at 70% 78%, transparent 118px, rgba(240, 207, 107, 0.04) 119px 130px, transparent 131px),
    /* 月亮光晕 + 夜空深浅 */
    radial-gradient(240px 240px at 82% 4%, rgba(240, 207, 107, 0.10), transparent 70%),
    radial-gradient(120% 80% at 100% 0%, rgba(63, 124, 191, 0.13), transparent 60%),
    radial-gradient(130% 90% at 0% 100%, rgba(13, 42, 82, 0.45), transparent 65%),
    var(--bg);
}

html[data-theme="light"] body {
  background:
    radial-gradient(160% 100% at 100% 0%, rgba(63, 124, 191, 0.10), transparent 55%),
    radial-gradient(130% 90% at 0% 100%, rgba(13, 59, 99, 0.08), transparent 60%),
    var(--bg);
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.35; }
p { margin: 0; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
a { color: var(--primary); text-decoration: none; }
::selection { background: color-mix(in srgb, var(--primary) 32%, transparent); }
.muted { color: var(--text2); }

.mono {
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  font-variant-numeric: tabular-nums;
}

kbd {
  display: inline-block; min-width: 20px; padding: 1px 6px; text-align: center;
  font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5;
  color: var(--text); background: var(--bg3);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
}

/* ---------------- 滚动条 ---------------- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--text2) 35%, transparent);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text2) 55%, transparent); }

/* ---------------- 布局骨架 ---------------- */
#app {
  display: grid;
  grid-template-areas:
    "top top"
    "side main"
    "side foot";
  grid-template-columns: 236px 1fr;
  grid-template-rows: 56px 1fr 36px;
  height: 100vh; overflow: hidden;
}

#topbar {
  grid-area: top;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--bg2); border-bottom: 1px solid var(--line); z-index: 30;
}

#sidebar {
  grid-area: side;
  display: flex; flex-direction: column;
  background: var(--bg2); border-right: 1px solid var(--line);
  overflow: hidden; z-index: 40;
}

#main { grid-area: main; overflow-y: auto; padding: 18px; min-width: 0; }

#statusbar {
  grid-area: foot;
  display: flex; align-items: center; gap: 18px; padding: 0 16px;
  font-size: 12px; color: var(--text2);
  background: var(--bg2); border-top: 1px solid var(--line);
  white-space: nowrap; overflow: hidden;
}

#statusbar b { color: var(--text); font-weight: 600; }

/* ---------------- 顶栏 ---------------- */
.brand-t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-t h1 { font-size: 17px; letter-spacing: 1px; white-space: nowrap; }
.brand-t h1 i { font-style: normal; font-size: 12px; color: var(--text2); margin-left: 6px; }
.tb-spacer { flex: 1; }
#tb-date { font-size: 12px; color: var(--text2); white-space: nowrap; }

#tb-count {
  padding: 4px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap;
  background: color-mix(in srgb, var(--star) 13%, transparent);
  color: var(--star);
  border: 1px solid color-mix(in srgb, var(--star) 36%, transparent);
  font-variant-numeric: tabular-nums;
}

#tb-count b { font-size: 16px; font-weight: 700; color: var(--star); }
#tb-count span { font-family: ui-monospace, Consolas, monospace; font-size: 12px; opacity: 0.9; }

#tb-pomo {
  padding: 4px 12px; border-radius: 999px; font-size: 13px; white-space: nowrap; cursor: pointer;
  background: color-mix(in srgb, var(--c-os) 16%, transparent); color: var(--c-os);
  border: 1px solid color-mix(in srgb, var(--c-os) 35%, transparent);
  font-family: ui-monospace, Consolas, monospace;
}

#tb-pomo:empty { display: none; }

/* ---------------- 侧栏 ---------------- */
#nav-list {
  flex: 1; display: flex; flex-direction: column; gap: 2px;
  padding: 10px 8px; overflow-y: auto;
}

.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; text-align: left; background: none; border: none;
  border-left: 3px solid transparent; border-radius: 8px; color: var(--text2);
  transition: background 0.15s, color 0.15s;
}

.nav-item:hover { background: var(--bg3); color: var(--text); }

.nav-item.active {
  background: var(--primary2); border-left-color: var(--primary);
  color: var(--primary); font-weight: 600;
}

.ni-icon { flex: none; width: 24px; text-align: center; font-size: 16px; }
.ni-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sb-foot {
  padding: 12px 14px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden;
}

/* 折叠态 */
#app.sb-mini { grid-template-columns: 58px 1fr; }
#app.sb-mini .ni-name { display: none; }
#app.sb-mini .sb-foot { font-size: 0; text-align: center; padding: 12px 4px; }
#app.sb-mini .nav-item { justify-content: center; padding: 9px 0; }
#app.sb-mini .ni-icon { width: 100%; }

/* 遮罩（移动抽屉用） */
#backdrop { display: none; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 16px; border-radius: 8px; font-size: 13px; line-height: 1.4;
  border: 1px solid var(--line); background: var(--bg3); color: var(--text);
  white-space: nowrap; user-select: none;
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}

.btn:hover {
  border-color: color-mix(in srgb, var(--primary) 45%, var(--line));
  background: color-mix(in srgb, var(--primary) 8%, var(--bg3));
}

.btn:active { transform: translateY(1px) scale(0.98); }

.btn:focus-visible,
.nav-item:focus-visible,
.icon-btn:focus-visible,
.tab:focus-visible,
.date-strip button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--primary) 60%, transparent);
  outline-offset: 1px;
}

.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover {
  background: color-mix(in srgb, var(--primary) 85%, #fff);
  border-color: color-mix(in srgb, var(--primary) 85%, #fff);
}

.btn.danger {
  background: transparent; border-color: color-mix(in srgb, var(--err) 50%, transparent); color: var(--err);
}
.btn.danger:hover { background: color-mix(in srgb, var(--err) 14%, transparent); }

.btn.ghost { background: transparent; border-color: transparent; color: var(--text2); }
.btn.ghost:hover { background: var(--bg3); color: var(--text); }
.btn.sm { padding: 3px 10px; font-size: 12px; border-radius: 6px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 28px; padding: 0 6px;
  border: none; border-radius: 6px; background: transparent;
  color: var(--text2); font-size: 14px; line-height: 1;
  transition: background 0.15s, color 0.15s;
}

.icon-btn:hover { background: var(--bg3); color: var(--text); }
.icon-btn:active { transform: scale(0.92); }

/* ---------------- 徽章 / 标签 / 状态片 ---------------- */
.badge {
  display: inline-block; padding: 1px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--b) 16%, transparent); color: var(--b);
  font-size: 12px; font-weight: 600; line-height: 1.6; white-space: nowrap;
}

.tag {
  display: inline-block; padding: 1px 8px; border-radius: 5px; font-size: 11px; white-space: nowrap;
  background: var(--bg3); color: var(--text2); border: 1px solid var(--line);
}

.chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap;
  background: var(--bg3); border: 1px solid var(--line);
}

/* 学习状态色（.st-* 彩色淡底片） */
.st-已掌握, .st-学习中, .st-薄弱, .st-未学 {
  display: inline-block; padding: 1px 9px; border-radius: 999px;
  border: 1px solid transparent; font-size: 12px; font-weight: 600; white-space: nowrap;
}

.st-已掌握 {
  color: var(--ok);
  background: color-mix(in srgb, var(--ok) 14%, transparent);
  border-color: color-mix(in srgb, var(--ok) 30%, transparent);
}

.st-学习中 {
  color: var(--c-ds);
  background: color-mix(in srgb, var(--c-ds) 14%, transparent);
  border-color: color-mix(in srgb, var(--c-ds) 30%, transparent);
}

.st-薄弱 {
  color: var(--err);
  background: color-mix(in srgb, var(--err) 14%, transparent);
  border-color: color-mix(in srgb, var(--err) 30%, transparent);
}

.st-未学 { color: var(--text2); background: var(--bg3); border-color: var(--line); }

/* 难度色 */
.diff-简单, .diff-中等, .diff-困难 {
  display: inline-block; padding: 1px 9px; border-radius: 999px;
  border: 1px solid transparent; font-size: 12px; font-weight: 600; white-space: nowrap;
}

.diff-简单 {
  color: var(--ok);
  background: color-mix(in srgb, var(--ok) 13%, transparent);
  border-color: color-mix(in srgb, var(--ok) 28%, transparent);
}

.diff-中等 {
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 14%, transparent);
  border-color: color-mix(in srgb, var(--warn) 30%, transparent);
}

.diff-困难 {
  color: var(--err);
  background: color-mix(in srgb, var(--err) 14%, transparent);
  border-color: color-mix(in srgb, var(--err) 32%, transparent);
}

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); overflow: hidden;
  animation: card-in 0.28s ease both;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.card-h {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid var(--line);
}

.card-h h3 { font-size: 14px; flex: 1; min-width: 0; }
.card-b { padding: 14px 16px; }
.card-b > * + * { margin-top: 10px; }

/* ---------------- 进度条 ---------------- */
.pbar { position: relative; display: flex; align-items: center; gap: 8px; }

.pbar::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: calc(100% - 44px); height: 8px; border-radius: 4px;
  background: var(--bg3); box-shadow: inset 0 0 0 1px var(--line);
}

.pbar i {
  position: relative; display: block; width: 0; height: 8px; max-width: calc(100% - 52px);
  border-radius: 4px; background: var(--primary); transition: width 0.4s ease;
}

.pbar span {
  margin-left: auto; width: 44px; flex: none; text-align: right;
  font-size: 12px; color: var(--text2);
}

/* ---------------- 统计卡 ---------------- */
.stat {
  display: flex; flex-direction: column; gap: 2px; position: relative;
  padding: 12px 14px 12px 18px; background: var(--bg3);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}

.stat::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: var(--sc, var(--primary));
}

.stat-v {
  font-size: 24px; font-weight: 700; line-height: 1.25;
  color: var(--sc, var(--primary));
}

.stat-l { font-size: 13px; color: var(--text); }
.stat-s { font-size: 11px; }

/* ---------------- 空状态 ---------------- */
.empty {
  padding: 26px 16px; text-align: center; color: var(--text2);
  border: 1.5px dashed var(--line); border-radius: 10px; font-size: 13px;
}

/* ---------------- 页头 ---------------- */
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
}

.ph-l h2 { font-size: 20px; }
.ph-l p { margin-top: 3px; font-size: 13px; }
.ph-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------------- 弹窗 ---------------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  background: rgba(6, 10, 16, 0.62);
  animation: mask-in 0.18s ease both;
}

@keyframes mask-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  display: flex; flex-direction: column; max-height: 86vh; max-width: 94vw;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  animation: modal-in 0.2s ease both;
}

@keyframes modal-in {
  from { opacity: 0; transform: scale(0.94) translateY(8px); }
  to { opacity: 1; transform: none; }
}

.modal.m-form { width: 520px; }
.modal.m-form.wide { width: 720px; }
.modal.m-confirm { width: 400px; }

.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}

.modal-head h3 { font-size: 15px; }
.modal-body { padding: 16px 18px; overflow-y: auto; font-size: 14px; }

.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 12px 18px; border-top: 1px solid var(--line);
}

/* 弹窗表单行 */
.mf-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.mf-row:last-of-type { margin-bottom: 0; }
.mf-label { font-size: 12px; color: var(--text2); }
.mf-label em { color: var(--err); font-style: normal; font-weight: 700; }

/* ---------------- 轻提示 ---------------- */
.toast {
  padding: 10px 16px; margin-top: 10px; font-size: 13px; max-width: 340px;
  background: var(--bg2); border: 1px solid var(--line);
  border-left: 3px solid var(--primary); border-radius: 8px; box-shadow: var(--shadow);
  animation: toast-in 0.2s ease both;
  transition: opacity 0.35s, transform 0.35s;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateX(24px); }
  to { opacity: 1; transform: none; }
}

.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--err); }
.toast.out { opacity: 0; transform: translateX(24px); }

#toast-root {
  position: fixed; right: 18px; bottom: 48px; z-index: 200;
  display: flex; flex-direction: column; align-items: flex-end;
}

/* ---------------- 图例 ---------------- */
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  font-size: 12px; color: var(--text2);
}

.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.lg-item i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--text2); }
.lg-item b { color: var(--text); font-weight: 600; }

/* ---------------- 表单控件 ---------------- */
input, select, textarea {
  width: 100%; padding: 7px 10px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--line); color: var(--text);
  font-family: inherit; font-size: 13px; line-height: 1.5;
  transition: border-color 0.15s, box-shadow 0.15s;
}

input::placeholder, textarea::placeholder {
  color: color-mix(in srgb, var(--text2) 75%, transparent);
}

input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 22%, transparent);
}

textarea { resize: vertical; min-height: 64px; }
select { cursor: pointer; }
input[type="date"], input[type="time"] { font-family: ui-monospace, Consolas, monospace; }

.cbx {
  width: 15px; height: 15px; flex: none; padding: 0;
  accent-color: var(--primary); cursor: pointer;
}

/* ---------------- 表格 ---------------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }

th, td {
  padding: 8px 10px; text-align: left; vertical-align: middle;
  border-bottom: 1px solid var(--line);
}

th { font-size: 12px; font-weight: 600; color: var(--text2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.12s; }
tbody tr:hover { background: var(--bg3); }

.mini-table { font-size: 12px; }
.mini-table th, .mini-table td { padding: 5px 8px; }

/* ---------------- 页面通用布局 ---------------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid-dash { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rowlist { display: flex; flex-direction: column; }

.row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
  border-bottom: 1px solid var(--line);
  transition: background 0.12s;
}

.row:hover { background: var(--bg3); }
.row:last-child { border-bottom: none; }

.grow { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-acts { display: flex; align-items: center; gap: 4px; flex: none; white-space: nowrap; }

/* ---------------- Tabs ---------------- */
.tabs {
  display: flex; gap: 4px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); margin-bottom: 12px;
}

.tab {
  padding: 7px 16px; background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  color: var(--text2); font-size: 13px; border-radius: 6px 6px 0 0;
  transition: color 0.15s, background 0.15s;
}

.tab:hover { color: var(--text); background: var(--bg3); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* ---------------- 大倒计时 ---------------- */
.big-count {
  font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums;
  font-size: 42px; font-weight: 700; color: var(--star);
  line-height: 1.2; letter-spacing: 1px;
  text-shadow: 0 0 24px color-mix(in srgb, var(--star) 30%, transparent);
}

/* ---------------- 到期强调 ---------------- */
.due { color: var(--err); font-weight: 600; }

.due::before {
  content: ""; display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--err); margin-right: 5px; vertical-align: 1px;
}

/* ---------------- 星级行 ---------------- */
.lv {
  display: inline-flex; align-items: center; gap: 2px;
  color: var(--c-eng); font-size: 13px; letter-spacing: 1px;
}

/* ---------------- 周条 ---------------- */
.date-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

.date-strip button {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px; background: var(--bg3);
  border: 1px solid var(--line); border-radius: 8px;
  color: var(--text2); font-size: 11px; line-height: 1.4;
  transition: border-color 0.15s, background 0.15s;
}

.date-strip button:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.date-strip button b { font-size: 14px; color: var(--text); font-weight: 600; }

.date-strip button.on {
  background: var(--primary2); border-color: var(--primary); color: var(--primary);
}

.date-strip button.on b { color: var(--primary); }

.date-strip button.is-today { border-color: color-mix(in srgb, var(--c-eng) 60%, var(--line)); }

/* 周条（span 版，目标规划页用） */
.date-strip .ds-day {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px; background: var(--bg3);
  border: 1px solid var(--line); border-radius: 8px;
  color: var(--text2); font-size: 11px; line-height: 1.4;
}

.date-strip .ds-day.on { background: var(--primary2); border-color: var(--primary); color: var(--primary); }
.date-strip .ds-day b { font-size: 14px; color: var(--text); font-weight: 600; }
.date-strip .ds-day.on b { color: var(--primary); }

/* 任务完成态 */
.row-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.row.done { opacity: 0.6; }
.row.done .grow, .row.done .row-text, .strike { text-decoration: line-through; color: var(--text2); }

/* ---------------- 专注热力图 ---------------- */
.heat-wrap { overflow-x: auto; padding-bottom: 4px; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
.heat-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--bg3); }
.heat-cell.l1 { background: color-mix(in srgb, var(--primary) 28%, var(--bg3)); }
.heat-cell.l2 { background: color-mix(in srgb, var(--primary) 52%, var(--bg3)); }
.heat-cell.l3 { background: color-mix(in srgb, var(--primary) 78%, var(--bg3)); }
.heat-cell.l4 { background: var(--primary); }
.heat-legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--text2); margin-top: 8px; }
.heat-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------------- 阶段时间轴（甘特） ---------------- */
.tl { position: relative; margin: 4px 0; }
.tl-track { position: relative; height: 30px; margin: 7px 0; background: var(--bg3); border-radius: 6px; }
.tl-bar {
  position: absolute; top: 3px; bottom: 3px; border-radius: 4px;
  display: flex; align-items: center; padding: 0 8px;
  font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden;
}
.tl-bar.cur { outline: 2px solid var(--star); outline-offset: 1px; }
.tl-now { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--star); border-radius: 1px; z-index: 2; }
.tl-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text2); }

/* ---------------- 今日目标环 ---------------- */
.ring {
  --p: 0;
  position: relative; width: 96px; height: 96px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--bg3) 0);
}
.ring-in {
  position: absolute; inset: 10px; border-radius: 50%;
  background: var(--bg2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.2;
}
.ring-in b { font-size: 17px; color: var(--primary); }
.ring-in span { font-size: 10px; color: var(--text2); }
.ring.gold { background: conic-gradient(var(--star) calc(var(--p) * 1%), var(--bg3) 0); }
.ring.gold .ring-in b { color: var(--star); }

/* ---------------- 全屏沉浸专注 ---------------- */
.pomo-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: radial-gradient(120% 90% at 50% 0%, rgba(63, 124, 191, 0.16), transparent 60%), rgba(5, 10, 18, 0.97);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.pomo-overlay .po-time {
  font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums;
  font-size: 100px; font-weight: 700; color: var(--star); line-height: 1.1;

}
.pomo-overlay .po-mode { font-size: 15px; color: var(--text2); letter-spacing: 2px; }
.pomo-overlay .po-acts { display: flex; gap: 10px; margin-top: 10px; }

/* ---------------- 激励语 ---------------- */
.quote {
  padding: 9px 14px; margin-top: 10px;
  border-left: 3px solid var(--star);
  background: color-mix(in srgb, var(--star) 8%, transparent);
  border-radius: 0 8px 8px 0;
  font-size: 12.5px; color: var(--text);
}

/* ---------------- 模板按钮 ---------------- */
.tpl-grid { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------------- 阶段卡（目标规划 DIY） ---------------- */
.stage-card { border-top: 3px solid var(--sc, var(--primary)); }
.stage-card .card-h { border-bottom: none; padding-bottom: 0; }
.stage-card .st-dates { font-size: 11px; color: var(--text2); font-family: ui-monospace, Consolas, monospace; }
.stage-card .st-goal { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
.stage-card .st-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

/* ---------------- 月历热力图 ---------------- */
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
.cal-head span { text-align: center; font-size: 11px; color: var(--text2); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell {
  position: relative; min-height: 40px; border-radius: 6px;
  background: var(--bg3); padding: 3px 5px; text-align: left;
  font-size: 10px; color: var(--text2); border: 1px solid transparent;
}
.cal-cell.l1 { background: color-mix(in srgb, var(--primary) 26%, var(--bg3)); }
.cal-cell.l2 { background: color-mix(in srgb, var(--primary) 48%, var(--bg3)); }
.cal-cell.l3 { background: color-mix(in srgb, var(--primary) 72%, var(--bg3)); }
.cal-cell.l4 { background: color-mix(in srgb, var(--primary) 92%, var(--bg3)); }
.cal-cell.blank { background: transparent; }
.cal-cell.is-today { border-color: var(--star); }
.cal-cell .cd { display: block; font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 600; }
.cal-cell.l1 .cd, .cal-cell.l2 .cd, .cal-cell.l3 .cd, .cal-cell.l4 .cd { color: #fff; }
.cal-cell .cm { position: absolute; bottom: 3px; left: 5px; font-size: 9px; opacity: 0.85; }
.cal-cell.habit-on::after {
  content: "✊"; position: absolute; top: 2px; right: 3px; font-size: 9px;
}

/* ---------------- 习惯行 ---------------- */
.habit-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.habit-row:last-child { border-bottom: none; }
.habit-streak { font-size: 11px; color: var(--c-eng); white-space: nowrap; }

/* ---------------- 科目进度行 ---------------- */
.sub-bar { display: flex; align-items: center; gap: 10px; }

.sub-bar > .sb-name {
  flex: none; width: 90px; font-size: 13px; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.sub-bar .pbar { flex: 1; min-width: 0; }

/* ---------------- 心态表情 ---------------- */
.mood-face { display: flex; gap: 8px; }

.mood-face button {
  flex: 1; padding: 8px 0; font-size: 22px; line-height: 1;
  background: var(--bg3); border: 2px solid var(--line); border-radius: 10px;
  transition: border-color 0.15s, transform 0.1s, background 0.15s;
}

.mood-face button:hover { transform: scale(1.08); }
.mood-face button.on { border-color: var(--primary); background: var(--primary2); }

/* ---------------- 院校卡 ---------------- */
.school-card { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 13px; }
.school-card dt, .school-card .sc-k { color: var(--text2); white-space: nowrap; }

.school-card dd, .school-card .sc-v {
  margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere;
}

/* ---------------- 快捷键说明 ---------------- */
.help-kbd-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.help-kbd-list .hk-row { display: flex; align-items: center; gap: 10px; }
.help-kbd-list .hk-keys { flex: none; min-width: 110px; }

/* ---------------- 每日一题 ---------------- */
.q-opt {
  display: block; width: 100%; text-align: left;
  padding: 9px 14px; margin-top: 8px; font-size: 13px; line-height: 1.5;
  background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
  transition: border-color 0.15s, background 0.15s;
}

.q-opt:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }

.q-opt.right {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 12%, transparent);
  color: var(--ok);
}

.q-opt.wrong {
  border-color: var(--err);
  background: color-mix(in srgb, var(--err) 12%, transparent);
  color: var(--err);
}

.q-explain {
  margin-top: 12px; padding: 12px 14px; font-size: 13px;
  background: var(--primary2); border-left: 3px solid var(--primary);
  border-radius: 0 8px 8px 0;
}

/* ---------------- 弹窗根 / 杂项 ---------------- */
#modal-root:empty { display: none; }
canvas { display: block; max-width: 100%; }

/* 说明：模板固定 id（#app #topbar #sidebar #nav-list #backdrop #main
   #statusbar #modal-root #toast-root #tb-* #st-*）样式均在本文件内实现 */

/* ---------------- 响应式 ---------------- */
@media (max-width: 1100px) {
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

@media (max-width: 920px) {
  #app {
    grid-template-areas:

  #app.sb-open #backdrop { opacity: 1; pointer-events: auto; }

  .brand-t h1 i { display: none; }

}

@media (max-width: 600px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }

  #toast-root { right: 10px; left: 10px; bottom: 44px; }

}

<script>
'use strict';
/* =====================================================================
   研途408 · core.js —— 全局契约层
   工具 / 存储 / 路由 / 动作委托 / Modal / Toast / Charts / 番茄引擎 / 提醒引擎
   其他 part 只允许使用，禁止重定义本文件任何标识符（清单见 SPEC.md）
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const todayStr = d => { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const today = () => todayStr();
const parseDate = s => { const p = String(s).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return todayStr(d); };
const diffDays = (a, b) => Math.round((parseDate(a) - parseDate(b)) / 86400000);
const fmtDateCN = s => { const d = parseDate(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const monthKey = s => String(s).slice(0, 7);
const num = (v, d) => { const n = parseFloat(v); return isNaN(n) ? (d || 0) : n; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function fmtMin(m) {
  m = Math.round(m || 0);
  const h = Math.floor(m / 60);
  if (h <= 0) return m + '分钟';
  return h + '小时' + (m % 60 ? (m % 60) + '分' : '');
}
function isoWeek(dateStr) {
  const d = parseDate(dateStr);
  const t = new Date(d); t.setHours(0, 0, 0, 0);
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  const wk = 1 + Math.round(((t - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return t.getFullYear() + '-W' + pad2(wk);
}
function weekDates(dateStr) {
  const d = parseDate(dateStr);
  const mon = new Date(d);
  mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const out = [];
  for (let i = 0; i < 7; i++) { const x = new Date(mon); x.setDate(mon.getDate() + i); out.push(todayStr(x)); }
  return out;
}
const WEEK_CN = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const weekCN = s => WEEK_CN[(parseDate(s).getDay() + 6) % 7];

/* ---------------- 学科体系 ---------------- */
const SUBJECTS = {
  ds:   { name: '数据结构',   short: '数据', color: 'var(--c-ds)' },
  comp: { name: '组成原理',   short: '组成', color: 'var(--c-comp)' },
  os:   { name: '操作系统',   short: '操作', color: 'var(--c-os)' },
  net:  { name: '计算机网络', short: '网络', color: 'var(--c-net)' },
  math: { name: '数学一',     short: '数学', color: 'var(--c-math)' },
  eng:  { name: '英语一',     short: '英语', color: 'var(--c-eng)' },
  pol:  { name: '政治',       short: '政治', color: 'var(--c-pol)' }
};
const SUBJ_ORDER = ['ds', 'comp', 'os', 'net', 'math', 'eng', 'pol'];
const SUBJ408 = ['ds', 'comp', 'os', 'net'];
const subBadge = k => SUBJECTS[k] ? '<span class="badge" style="--b:' + SUBJECTS[k].color + '">' + esc(SUBJECTS[k].short) + '</span>' : '';

/* ---------------- 存储层 ---------------- */
const DB_KEY = 'ky408_v1';
const DB = {
  s: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(DB_KEY); if (raw) this.s = JSON.parse(raw); } catch (e) { this.s = null; }
    if (!this.s || typeof this.s !== 'object' || Array.isArray(this.s)) {
      if (raw) { try { localStorage.setItem(DB_KEY + '.corrupt', raw); } catch (e) {} }
      this.s = defaultState();
      this.save();
      setTimeout(() => toast('本地数据读取失败，已重置为初始状态；原数据备份在 ' + DB_KEY + '.corrupt', 'err'), 300);
    }
    try { if (migrate(this.s)) this.save(); } catch (e) { console.warn('migrate', e); }
  },
  save() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(this.s)); }
    catch (e) { toast('本地存储写入失败：' + e.message, 'err'); }
  }
};
let S = null;
function save() { DB.save(); }

/* ---------------- 轻提示 ---------------- */
function toast(msg, type) {
  const r = $('#toast-root');
  if (!r) return;
  const d = document.createElement('div');
  d.className = 'toast ' + (type || 'ok');
  d.textContent = msg;
  r.appendChild(d);
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 350); }, 2400);
}

/* ---------------- 弹窗 ---------------- */
const Modal = {
  _submit: null, _ok: null,
  open(html, cls) {
    $('#modal-root').innerHTML = '<div class="modal-mask" data-act="modal-mask"><div class="modal ' + (cls || '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
    const f = $('#modal-root').querySelector('input,textarea,select');
    if (f) setTimeout(() => { try { f.focus(); } catch (e) {} }, 60);
  },
  close() { $('#modal-root').innerHTML = ''; this._submit = null; this._ok = null; },
  isOpen() { return !!$('#modal-root').innerHTML; },
  form(opt) {
    const fields = opt.fields || [];
    const body = fields.map(f => {
      const v = f.value == null ? '' : f.value;
      let ctl;
      if (f.type === 'textarea') {
        ctl = '<textarea name="' + esc(f.key) + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
      } else if (f.type === 'select') {
        ctl = '<select name="' + esc(f.key) + '">' + (f.options || []).map(o => {

/* ---------------- 画图（canvas 手绘，无依赖） ---------------- */
const Charts = {
  css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
  _c(c) {
    if (!c) return this.css('--primary') || '#5b7fa6';
    if (String(c).indexOf('var(') === 0) return this.css(c.slice(4, -1).trim()) || '#5b7fa6';
    return c;
  },
  _setup(cv, h) {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(120, cv.clientWidth || (cv.parentElement ? cv.parentElement.clientWidth : 0) || 320);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.height = h + 'px';
    cv.style.width = '100%';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  },
  _empty(ctx, w, h) {
    ctx.fillStyle = this.css('--text2') || '#888';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', w / 2, h / 2);
  },
  _grid(ctx, w, h, yMin, yMax, cfg) {
    const padL = 46, padR = 14, padT = 16, padB = 26;
    const pw = w - padL - padR, ph = h - padT - padB;
    ctx.strokeStyle = this.css('--line') || 'rgba(128,128,128,.25)';
    ctx.lineWidth = 1;
    ctx.font = '10px ui-monospace,Consolas,monospace';
    ctx.fillStyle = this.css('--text2') || '#888';
    for (let g = 0; g <= 4; g++) {
      const gy = padT + ph * g / 4;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
      ctx.textAlign = 'right';
      const val = yMax - (yMax - yMin) * g / 4;
      ctx.fillText(cfg && cfg.fmt ? cfg.fmt(val) : String(Math.round(val * 10) / 10), padL - 6, gy + 3);
    }
    return { padL: padL, padR: padR, padT: padT, padB: padB, pw: pw, ph: ph };
  },
  _xlabels(ctx, labels, h, X) {
    ctx.fillStyle = this.css('--text2') || '#888';
    ctx.font = '10px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'center';
    const step = Math.max(1, Math.ceil(labels.length / 9));
    labels.forEach((lb, i) => { if (i % step === 0 || i === labels.length - 1) ctx.fillText(lb, X(i), h - 8); });
  },
  pie(cv, data, h) {
    h = h || 230;
    data = (data || []).filter(d => d.value > 0);
    const st = this._setup(cv, h);
    if (!data.length) { this._empty(st.ctx, st.w, st.h); return; }
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const cx = st.w / 2 - 34, cy = st.h / 2, R = Math.min(cx, cy) - 16, r = R * 0.58;
    let a = -Math.PI / 2;
    data.forEach((d, i) => {
      const a2 = a + d.value / total * Math.PI * 2;
      st.ctx.beginPath();
      st.ctx.arc(cx, cy, R, a, a2);
      st.ctx.arc(cx, cy, r, a2, a, true);
      st.ctx.closePath();
      st.ctx.fillStyle = this._c(d.color);
      st.ctx.fill();
      st.ctx.strokeStyle = this.css('--bg2') || '#222';
      st.ctx.lineWidth = 2;
      st.ctx.stroke();
      if (d.value / total > 0.075) {
        const mid = (a + a2) / 2, lr = (R + r) / 2;
        st.ctx.fillStyle = '#fff';
        st.ctx.font = '10px ui-monospace,monospace';
        st.ctx.textAlign = 'center';
        st.ctx.fillText(Math.round(d.value / total * 100) + '%', cx + lr * Math.cos(mid), cy + lr * Math.sin(mid) + 3);
      }
      a = a2;
    });
    st.ctx.fillStyle = this.css('--text') || '#eee';
    st.ctx.textAlign = 'center';
    st.ctx.font = 'bold 16px ui-monospace,monospace';
    st.ctx.fillText(String(Math.round(total)), cx, cy + 1);
    st.ctx.font = '10px sans-serif';
    st.ctx.fillStyle = this.css('--text2') || '#888';
    st.ctx.fillText('合计', cx, cy + 15);
  },
  legend(data) {
    return '<div class="legend">' + (data || []).filter(d => d.value > 0).map(d =>
      '<span class="lg-item"><i style="background:' + this._c(d.color) + '"></i>' + esc(d.label) +
      ' <b class="mono">' + d.value + '</b></span>').join('') + '</div>';
  },
  bar(cv, cfg, h) {
    h = h || 230;
    const st = this._setup(cv, h);
    const labels = cfg.labels || [], series = cfg.series || [];
    if (!labels.length || !series.length) { this._empty(st.ctx, st.w, st.h); return; }
    let yMax = cfg.yMax;
    if (yMax == null) {
      yMax = 0;
      series.forEach(s => s.data.forEach(v => { if (v != null && v > yMax) yMax = v; }));
      yMax = yMax * 1.15 || 1;
    }
    const g = this._grid(st.ctx, st.w, st.h, 0, yMax, cfg);
    const slot = g.pw / labels.length;
    const bw = Math.max(3, Math.min(36, slot * 0.72 / series.length));
    labels.forEach((lb, i) => {
      series.forEach((sr, si) => {
        const v = sr.data[i] == null ? 0 : sr.data[i];
        const bh = v / yMax * g.ph;
        const bx = g.padL + slot * i + slot / 2 - (bw * series.length) / 2 + bw * si;
        st.ctx.fillStyle = this._c(sr.color);
        st.ctx.fillRect(bx, g.padT + g.ph - bh, bw - 2, bh);
      });
    });
    this._xlabels(st.ctx, labels, st.h, i => g.padL + slot * i + slot / 2);
  },
  line(cv, cfg, h) {
    h = h || 230;
    const st = this._setup(cv, h);
    const labels = cfg.labels || [], series = cfg.series || [];
    const hasData = series.some(s => (s.data || []).some(v => v != null));
    if (!labels.length || !series.length || !hasData) { this._empty(st.ctx, st.w, st.h); return; }
    let yMax = cfg.yMax;
    if (yMax == null) {
      yMax = -Infinity;
      series.forEach(s => s.data.forEach(v => { if (v != null && v > yMax) yMax = v; }));
      yMax = isFinite(yMax) ? (yMax * 1.15 || 1) : 1;
    }
    const yMin = cfg.yMin != null ? cfg.yMin : 0;
    const g = this._grid(st.ctx, st.w, st.h, yMin, yMax, cfg);
    const X = i => g.padL + (labels.length === 1 ? g.pw / 2 : i * g.pw / (labels.length - 1));
    const Y = v => g.padT + g.ph - (v - yMin) / (yMax - yMin || 1) * g.ph;
    this._xlabels(st.ctx, labels, st.h, X);
    series.forEach(sr => {
      const col = this._c(sr.color);
      st.ctx.strokeStyle = col;
      st.ctx.fillStyle = col;
      st.ctx.lineWidth = 2;
      st.ctx.beginPath();
      let started = false;
      sr.data.forEach((v, i) => {
        if (v == null) { started = false; return; }
        if (!started) { st.ctx.moveTo(X(i), Y(v)); started = true; }
        else st.ctx.lineTo(X(i), Y(v));
      });
      st.ctx.stroke();
      sr.data.forEach((v, i) => {
        if (v == null) return;
        st.ctx.beginPath();
        st.ctx.arc(X(i), Y(v), 2.5, 0, Math.PI * 2);
        st.ctx.fill();
      });
    });
  }
};

/* ---------------- 番茄引擎 ---------------- */
const Pomo = {
  st: { running: false, paused: false, mode: 'focus', sub: 'ds', endAt: 0, remainMs: 0, min: 45 },
  _ui: null,
  setUI(fn) { this._ui = fn; },
  ui() { if (this._ui) { try { this._ui(); } catch (e) {} } },
  // 番茄进行状态落盘（刷新/关闭后可恢复；到点很久的作废不补记）
  _persist() {
    const st = this.st;
    S.pomo.cur = st.running ? {
      running: true, paused: !!st.paused, mode: st.mode, sub: st.sub,
      endAt: st.endAt, remainMs: st.remainMs, min: st.min, taskId: st.taskId || null
    } : null;
  },
  start(min, mode, sub, taskId) {
    this.st = {
      running: true, paused: false,
      mode: mode || 'focus',
      sub: sub || S.pomo.lastSub || 'ds',
      endAt: Date.now() + min * 60000,
      remainMs: min * 60000,
      min: min,
      taskId: taskId || null
    };
    if ((mode || 'focus') === 'focus') S.pomo.lastSub = this.st.sub;
    this._persist();
    save();
    this.ui();
  },
  pause() {
    if (!this.st.running || this.st.paused) return;
    this.st.paused = true;
    this.st.remainMs = Math.max(0, this.st.endAt - Date.now());
    this._persist();
    this.ui();
  },
  resume() {
    if (!this.st.paused) return;
    this.st.endAt = Date.now() + this.st.remainMs;
    this.st.paused = false;
    this._persist();
    this.ui();
  },
  stop(logIt) {
    const st = this.st;
    if (logIt && st.running && st.mode === 'focus') {
      const remainMin = (st.paused ? st.remainMs : st.endAt - Date.now()) / 60000;
      const used = st.min - Math.ceil(remainMin);
      if (used >= 1) {
        (S.pomo.log[today()] = S.pomo.log[today()] || []).push({ sub: st.sub, min: used, ts: Date.now(), taskId: st.taskId || null });
        toast('已记录本次专注 ' + fmtMin(used));
      }
    }
    st.running = false;
    st.paused = false;
    this._persist();
    save();
    this.ui();
  },
  tick() {
    const st = this.st;
    if (!st.running || st.paused) return;
    if (Date.now() < st.endAt) return;
    if (st.mode === 'focus') {
      (S.pomo.log[today()] = S.pomo.log[today()] || []).push({ sub: st.sub, min: st.min, ts: Date.now(), taskId: st.taskId || null });
      beep(3);
      if (S.pomo.autoNext) {
        toast('🍅 番茄完成！自动进入休息 ' + S.pomo.breakMin + ' 分钟');
        this.start(S.pomo.breakMin, 'break', st.sub);
      } else {
        toast('🍅 番茄完成，休息一下吧！');
        st.running = false; st.paused = false;
      }
    } else {
      beep(2);
      toast('☕ 休息结束，准备开始下一个番茄');
      st.running = false; st.paused = false;
    }
    this._persist();
    save();
    this.ui();
  },
  remainMs() {
    const st = this.st;
    if (!st.running) return 0;
    return st.paused ? st.remainMs : Math.max(0, st.endAt - Date.now());
  },
  mmss() {
    const t = Math.ceil(this.remainMs() / 1000);
    return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
  }
};

/* ---------------- 倒计时 / 状态栏 / 提醒 ---------------- */
function countdownParts() {
  let target = new Date(S.examDate || '2027-12-18T08:30');
  if (isNaN(target.getTime())) target = new Date('2027-12-18T08:30');
  let diff = target - new Date();
  const neg = diff < 0;
  diff = Math.abs(diff);
  return {
    neg: neg,
    d: Math.floor(diff / 86400000),
    h: Math.floor(diff % 86400000 / 3600000),
    m: Math.floor(diff % 3600000 / 60000),
    s: Math.floor(diff % 60000 / 1000)
  };
}
function updateCountdown() {
  const el = $('#tb-count');
  if (!el) return;
  const c = countdownParts();
  if (c.neg) { el.innerHTML = '🎓 初试已结束'; return; }
  el.innerHTML = '⏳ 距初试 <b>' + c.d + '</b> 天 <span>' + pad2(c.h) + ':' + pad2(c.m) + ':' + pad2(c.s) + '</span>';
  const big = $('#dash-count');
  if (big) big.textContent = c.d + ' 天 ' + pad2(c.h) + ':' + pad2(c.m) + ':' + pad2(c.s);
}
function updateStatusbar() {

let _lastEye = Date.now();
const _reminded = new Set();
function checkReminders() {
  if (!S) return;
  if (S.reminders.eyeOn && Date.now() - _lastEye >= S.reminders.eyeMin * 60000 && !Modal.isOpen()) {
    _lastEye = Date.now();
    beep(2);
    Modal.confirm({
      title: '🌿 护眼提醒',
      message: '已经连续学习 <b>' + S.reminders.eyeMin + '</b> 分钟啦～<br>起身活动一下，远眺 20 秒，保护眼睛。',
      okText: '收到', danger: false
    });
  }
  const now = new Date();
  const hm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  (S.schedule || []).forEach(it => {
    if (it.remind && it.start === hm && !_reminded.has(today() + it.id)) {
      _reminded.add(today() + it.id);
      beep(1);
      toast('⏰ 作息提醒：' + it.label);
    }
  });
}
function beep(n) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = beep._ac || (beep._ac = new AC());
    for (let i = 0; i < (n || 1); i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.22);
      g.gain.exponentialRampToValueAtTime(0.12, ac.currentTime + i * 0.22 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.22 + 0.18);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + i * 0.22);
      o.stop(ac.currentTime + i * 0.22 + 0.2);
    }
  } catch (e) {}
}

/* ---------------- 白噪音（WebAudio 生成棕噪声，零外部依赖） ---------------- */
const Noise = {
  _ac: null, _src: null, _gain: null,
  on: false,
  _ctx() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!this._ac) this._ac = new AC();
    if (this._ac.state === 'suspended') { try { this._ac.resume(); } catch (e) {} }
    return this._ac;
  },
  _buffer(ac) {
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      d[i] = last * 3.2;
    }
    return buf;
  },
  start() {
    if (this.on) return true;
    const ac = this._ctx();
    if (!ac) { toast('当前浏览器不支持音频', 'err'); return false; }
    this._src = ac.createBufferSource();
    this._src.buffer = this._buffer(ac);
    this._src.loop = true;
    this._gain = ac.createGain();
    this._gain.gain.value = 0.045;
    this._src.connect(this._gain);
    this._gain.connect(ac.destination);
    this._src.start();
    this.on = true;
    return true;
  },
  stop() {
    if (!this.on) return;
    try { if (this._src) this._src.stop(); } catch (e) {}
    this._src = null;
    this._gain = null;
    this.on = false;
  },
  toggle() {
    if (this.on) { this.stop(); return false; }
    return this.start();
  }
};

/* ---------------- 主题 / 导出 ---------------- */
function setTheme(t) {
  S.theme = t;
  document.documentElement.dataset.theme = t;
  const b = $('#tb-theme');
  if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
  save();
  rerender();
}
function downloadText(filename, text) {
  const blob = new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ---------------- 侧边栏 / 快捷键 / 启动 ---------------- */
function buildSidebar() {
  const el = $('#nav-list');
  el.innerHTML = PAGE_ORDER.map(id => {
    const p = PAGES[id];
    return '<button class="nav-item" data-act="nav-page" data-page="' + id + '" id="nav-' + id + '">' +
      '<span class="ni-icon">' + p.icon + '</span><span class="ni-name">' + p.name + '</span></button>';
  }).join('');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const tag = (e.target.tagName || '').toLowerCase();
    if (Modal.isOpen() && (tag === 'textarea' || e.target.isContentEditable)) {
      e.target.blur();
      return;
    }
    if (Modal.isOpen()) Modal.close();
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (Modal.isOpen()) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'n' && Actions['quick-add-task']) Actions['quick-add-task']();
  else if (k === 'p' && Actions['pomo-toggle']) Actions['pomo-toggle']();
  else if (k === 't') Actions['toggle-theme']();
});
function startTimers() {
  updateCountdown();
  updateStatusbar();
  setInterval(() => {
    try {
      updateCountdown();
      if (S) {
        Pomo.tick();
        Pomo.ui();
        updateStatusbar();
      }
    } catch (e) { console.warn('tick', e); }
  }, 1000);
  setInterval(checkReminders, 20000);
}
function initApp() {
  DB.load();
  S = DB.s;
  document.documentElement.dataset.theme = S.theme || 'dark';
  // 恢复进行中的番茄（若离开期间早已到点超过 2 分钟，作废不补记，避免虚增时长）
  try {
    const cur = S.pomo.cur;
    if (cur && cur.running) {
      if (!cur.paused && Date.now() >= cur.endAt && Date.now() - cur.endAt > 120000) {
        S.pomo.cur = null;
      } else {
        Pomo.st = {
          running: true, paused: !!cur.paused, mode: cur.mode || 'focus',
          sub: cur.sub || S.pomo.lastSub || 'ds', endAt: cur.endAt,
          remainMs: cur.remainMs, min: cur.min || S.pomo.focusMin, taskId: cur.taskId || null
        };
      }
    }
  } catch (e) {}
  const b = $('#tb-theme');
  if (b) b.textContent = (S.theme || 'dark') === 'dark' ? '☀️' : '🌙';
  const now = new Date();
  $('#tb-date').textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + WEEK_CN[(now.getDay() + 6) % 7];
  try { if (localStorage.getItem('ky408_sbmini') === '1') $('#app').classList.add('sb-mini'); } catch (e) {}
  buildSidebar();
  let last = 'dashboard';
  try { last = localStorage.getItem('ky408_page') || 'dashboard'; } catch (e) {}
  currentPage = PAGES[last] ? last : PAGE_ORDER[0];
  renderCurrent();
  startTimers();
  window.addEventListener('resize', debounce(rerender, 350));
}
document.addEventListener('DOMContentLoaded', initApp);

/* ---- 卡1 倒计时 + 关键节点 ---- */
function _dashCountdown() {
  const c = countdownParts();
  const big = c.neg ? '已结束' : c.d + ' 天 ' + pad2(c.h) + ':' + pad2(c.m) + ':' + pad2(c.s);
  const rows = (S.keyNodes || []).slice().sort((a, b) => a.date < b.date ? -1 : 1).map(n => {
    const left = diffDays(n.date, today());
    const cls = left < 0 ? ' class="muted"' : (left <= 7 ? ' class="due"' : '');
    return '<div class="row">' +
      '<span class="grow">' + esc(n.name) + ' <span class="muted mono">' + esc(n.date) + '</span></span>' +
      '<b' + cls + '>' + (left < 0 ? '已过' : '还有 ' + left + ' 天') + '</b>' +
      '<button class="icon-btn" data-act="dash-node-edit" data-id="' + esc(n.id) + '" title="编辑">✎</button>' +
      '<button class="icon-btn" data-act="dash-node-del" data-id="' + esc(n.id) + '" title="删除">✕</button>' +
      '</div>';
  }).join('');
  const st = stageOfDate(today());
  let stageLine = '<div class="muted" style="margin-top:4px">📍 当前不在任何阶段内</div>';
  if (st && diffDays(st.end, today()) >= 0) {
    const n = diffDays(today(), st.start) + 1;
    const m = diffDays(st.end, st.start) + 1;
    const k = diffDays(st.end, today());
    stageLine = '<div class="muted" style="margin-top:4px">📍 ' + esc(st.name) +
      ' · 阶段内第 ' + n + ' 天 / 共 ' + m + ' 天 · ' +
      (k === 0 ? '<b class="due">今日截止</b>' : '距阶段结束还有 <b>' + k + '</b> 天') + '</div>';
  }
  return card('⏳ 倒计时 · 关键节点',
    '<div class="big-count mono" id="dash-count">' + esc(big) + '</div>' +
    '<div class="muted">距 <b>' + new Date(S.examDate || '2027-12-18T08:30').getFullYear() + '</b> 考研初试 <button class="btn ghost sm" data-act="dash-edit-exam">修改日期</button></div>' +
    stageLine +
    '<div class="sep"></div>' + (rows || empty('暂无关键节点，点右上 + 添加')) +
    '<div style="margin-top:8px"><button class="btn ghost sm" data-act="dash-node-add">＋ 添加节点</button></div>');
}

/* ---- 卡2 今日任务 ---- */
function _dashToday() {
  const list = tasksOn(today());
  const opts = SUBJ_ORDER.map(k => '<option value="' + k + '">' + esc(SUBJECTS[k].short) + '</option>').join('');
  const rows = list.slice(0, 8).map(t => {
    const fmin = taskFocusMin(today(), t.id);
    return '<div class="row' + (t.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-change="dash-task-toggle" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + '>' +
      subBadge(t.subject) + '<span class="grow">' + esc(t.text) + '</span>' +
      (fmin > 0 ? '<span class="tag">🍅 ' + fmin + '分</span>' : '') +
      '<button class="icon-btn" data-act="dash-task-del" data-id="' + esc(t.id) + '" title="删除">✕</button>' +
      '</div>';
  }).join('');
  const more = list.length > 8 ? '<button class="btn ghost sm" data-act="dash-go-daily">查看全部（' + list.length + ' 条）</button>' : '';
  return card('✅ 今日任务',
    '<form data-submit="dash-quick-add" class="row">' +
    '<input name="text" placeholder="快速添加任务…" required>' +
    '<select name="subject">' + opts + '</select>' +
    '<button class="btn primary sm" type="submit">添加</button></form>' +
    '<div class="sep"></div>' + (rows || empty('今天还没有任务')) + (more || '') +
    '<div class="quote">💡 ' + esc(quoteOfDay()) + '</div>');
}

/* ---- 卡3 全科进度 ---- */
function _dashProgress() {
  const manual = PROGRESS_MANUAL_KEYS;
  const rows = PROGRESS_KEYS.map(k => {
    const isMathMod = MATH_MODULES.some(x => x.k === k);

/* ---- 卡4 里程碑 ---- */
function _dashMilestones() {

    '<span class="grow"' + (m.done ? ' style="text-decoration:line-through;opacity:.75"' : '') + '>' + esc(m.name) + '</span>' +
    '<button class="icon-btn" data-act="dash-ms-del" data-id="' + esc(m.id) + '" title="删除">✕</button>' +
    '</div>').join('');

/* ---- 卡5 每日习惯 ---- */
function _dashHabit() {

/* ---- 卡6 艾宾浩斯到期 ---- */
function _dashMem() {
  const due = dueMemItems();

/* ---- 卡6 每日一题 ---- */
function _dashQuestion() {
  const q = todayQuestion();
  if (!q) return card('📝 每日一题', empty('题库为空，去工具箱添加题目吧'),
    '', '<button class="btn ghost sm" data-act="dash-go-tools">全部题目 →</button>');
  const log = (S.dailyQLog || []).find(l => l.date === today() && l.qid === q.id);
  const letters = ['A', 'B', 'C', 'D'];
  const opts = q.options.map((o, i) => {
    const L = letters[i];
    let cls = 'q-opt', act = ' data-act="dash-q-answer" data-k="' + L + '"';
    if (log) {
      act = '';
      if (L === q.answer) cls += ' right';
      else if (L === log.choice) cls += ' wrong';
    }
    return '<button class="' + cls + '"' + act + '><b>' + L + '</b> ' + esc(o) + '</button>';
  }).join('');
  let explain = '';
  if (log) {
    explain = '<div class="q-explain">答案 <b>' + esc(q.answer) + '</b> · ' + esc(q.explain || '') +
      '<br>' + (log.correct ? '答对了，继续保持！🎉' : '答错了也没关系，吃透解析～') + '</div>';

}

/* ---- 卡9 今日 & 本周 ---- */
function _dashWeek() {
  const td = today();
  const wd = weekDates(td);
  const pct = clamp(Math.round(todayFocusMin() / dailyGoalMin() * 100), 0, 100);
  const ts = tasksOn(td);
  const tDone = ts.filter(t => t.done).length;
  const last7 = focusSum(addDays(td, -6), td);
  const prev7 = focusSum(addDays(td, -13), addDays(td, -7));
  let cmp = '—';
  if (prev7 > 0) {
    const dff = last7 - prev7;
    if (dff > 0) cmp = '<b style="color:var(--ok)">↑ ' + Math.round(dff / prev7 * 100) + '%</b>';
    else if (dff < 0) cmp = '<b style="color:var(--err)">↓ ' + Math.round(-dff / prev7 * 100) + '%</b>';
  } else if (last7 > 0) {
    cmp = '<b style="color:var(--ok)">↑ 新纪录</b>';
  }
  return card('⚡ 今日 & 本周',
    '<div class="row" style="align-items:center;gap:14px">' +
    '<div class="ring' + (pct >= 100 ? ' gold' : '') + '" style="--p:' + pct + '">' +
    '<div class="ring-in"><b>' + pct + '%</b><span>今日目标</span></div></div>' +
    '<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
    statCard('🍅 今日番茄', todayPomoCount() + ' 个', '', SUBJECTS.eng.color) +
    statCard('🔥 连续专注', pomoStreak() + ' 天', '', SUBJECTS.pol.color) +
    statCard('本周专注', fmtMin(focusSum(wd[0], wd[6])), '', SUBJECTS.math.color) +
    statCard('今日任务', tDone + '/' + ts.length, '', SUBJECTS.ds.color) +
    '</div></div>' +
    '<div class="sep"></div>' +
    '<div class="row"><span class="grow">近7天 <b class="mono">' + fmtMin(last7) + '</b></span>' +
    '<span>对比前7天（' + fmtMin(prev7) + '）：' + cmp + '</span></div>' +
    '<div style="margin-top:10px"><button class="btn primary" data-act="dash-pomo">🍅 开始专注</button></div>');
}

/* ---- 卡10 月历热力 · 专注打卡 ---- */
function _minShort(m) {
  m = Math.round(m || 0);
  if (m < 60) return m + 'm';
  return (m % 60 === 0 ? m / 60 : Math.round(m / 6) / 10) + 'h';
}
function _dashHeat() {
  S._ui = S._ui || {};
  const td = today();
  const mk = S._ui.heatMonth || monthKey(td);
  const y = num(mk.split('-')[0]), mo = num(mk.split('-')[1]);
  const lead = (parseDate(mk + '-01').getDay() + 6) % 7;   // 周一为第一列，前置空位数
  const daysInMonth = new Date(y, mo, 0).getDate();
  const habits = S.habits || [];
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell blank"></div>';
  let monthTotal = 0, focusDays = 0;
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = y + '-' + pad2(mo) + '-' + pad2(day);
    const min = focusSum(ds, ds);
    monthTotal += min;
    if (min > 0) focusDays++;
    let cls = 'cal-cell';
    if (min > 120) cls += ' l4';
    else if (min > 60) cls += ' l3';
    else if (min > 30) cls += ' l2';
    else if (min > 0) cls += ' l1';
    if (ds === td) cls += ' is-today';
    if (habits.length && habits.every(h => h.dates && h.dates[ds])) cls += ' habit-on';
    cells += '<div class="' + cls + '" data-act="dash-heat-day" data-date="' + ds + '" title="点击查看当日打卡">' +
      '<span class="cd">' + pad2(day) + '</span>' +
      (min > 0 ? '<span class="cm">' + _minShort(min) + '</span>' : '') + '</div>';
  }
  const nextMk = _monthShift(mk, 1);
  return card('🗓 月历热力 · 专注打卡',
    '<div class="row">' +
    '<button class="btn ghost sm" data-act="dash-heat-nav" data-d="-1">‹ 上一月</button>' +
    '<b class="mono grow" style="text-align:center">' + y + '年' + pad2(mo) + '月</b>' +
    (nextMk > monthKey(td)
      ? '<button class="btn ghost sm" disabled>下一月 ›</button>'
      : '<button class="btn ghost sm" data-act="dash-heat-nav" data-d="1">下一月 ›</button>') +
    '</div><div class="sep"></div>' +
    '<div class="cal-head">' + ['一', '二', '三', '四', '五', '六', '日'].map(x => '<span>' + x + '</span>').join('') + '</div>' +
    '<div class="cal-grid">' + cells + '</div>' +
    '<div class="sep"></div>' +
    '<div class="row"><span>当月合计 <b class="mono">' + fmtMin(monthTotal) + '</b></span>' +
    '<span class="grow" style="text-align:right">已专注 <b class="mono">' + focusDays + '</b> 天</span></div>' +
    '<div class="heat-legend"><span>少</span>' +
    '<i style="background:var(--bg3)"></i>' +
    '<i style="background:color-mix(in srgb, var(--primary) 26%, var(--bg3))"></i>' +
    '<i style="background:color-mix(in srgb, var(--primary) 48%, var(--bg3))"></i>' +
    '<i style="background:color-mix(in srgb, var(--primary) 72%, var(--bg3))"></i>' +
    '<i style="background:color-mix(in srgb, var(--primary) 92%, var(--bg3))"></i>' +
    '<span>多</span></div>');
}

/* ================= 页面二：目标规划（子标签：总览 / 月度计划 / 周计划） ================= */
const STAGE_PAL = ['var(--c-ds)', 'var(--c-comp)', 'var(--c-os)', 'var(--c-net)', 'var(--c-math)', 'var(--c-eng)', 'var(--c-pol)'];
function _sortedStages() { return (S.stages || []).slice().sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0); }

registerPage('goals', {
  name: '目标规划', icon: '🎯',
  render(el) {
    S._ui = S._ui || {};
    if (!S._ui.goalsTab) S._ui.goalsTab = 'overview';

    const tab = S._ui.goalsTab;

    let body;
    if (tab === 'month') body = _goalsMonthCard();
    else if (tab === 'week') body = _goalsWeekCard();
    else body = _goalsTimeline() + _stageCards() + _goalsTrend();
    el.innerHTML = pageHead('目标规划', '四级联动：阶段 → 月 → 周 → 日，任务完成自动同步进度') + tabBar + body;

          ],
          yMax: 100
        }, 200);
      }
    } catch (e) {}
  }
});
Actions['goals-tab'] = d => { S._ui.goalsTab = d.t; rerender(); };

/* ---- 总览 · 阶段时间轴（支持任意阶段数） ---- */
function _goalsTimeline() {
  const sts = _sortedStages();
  if (!sts.length) return card('🗺 阶段时间轴', empty('暂无阶段，先在下方添加一个'));
  const start = sts.reduce((m, st) => st.start < m ? st.start : m, sts[0].start);
  const end = sts.reduce((m, st) => st.end > m ? st.end : m, sts[0].end);
  const total = diffDays(end, start);
  if (total <= 0) return card('🗺 阶段时间轴', empty('阶段日期尚未配置'));
  const cur = stageOfDate(today());
  const bars = sts.map((st, i) => {
    const left = diffDays(st.start, start) / total * 100;
    const width = (diffDays(st.end, st.start) + 1) / total * 100;
    const nm = String(st.name || '');
    const label = esc(width < 12 ? nm.slice(0, 1) : nm);
    return '<div class="tl-bar' + (cur && cur.id === st.id ? ' cur' : '') + '" style="left:' + left + '%;width:' + width + '%;background:' + STAGE_PAL[i % STAGE_PAL.length] + '">' + label + '</div>';
  }).join('');
  const td = today();
  const now = (td >= start && td <= end)
    ? '<div class="tl-now" style="left:' + (diffDays(td, start) / total * 100) + '%"></div>' : '';
  return card('🗺 阶段时间轴',
    '<div class="tl"><div class="tl-track">' + bars + now + '</div>' +
    '<div class="tl-labels"><span>' + start.slice(0, 7) + '</span><span>' + end.slice(0, 7) + '</span></div></div>');
}

/* ---- 总览 · DIY 阶段卡（自由添加 / 编辑 / 删除） ---- */
function _stageCards() {
  const cur = stageOfDate(today());
  const cards = _sortedStages().map((st, i) => {
    const col = STAGE_PAL[i % STAGE_PAL.length];
    // 阶段进度 = 日期范围内各月 monthKey 条目完成率的平均（沿用旧 _stageRate 口径）
    const agg = { done: 0, total: 0, rates: [] };
    let mk = monthKey(st.start);
    const endMk = monthKey(st.end);
    while (mk <= endMk) {
      const m = (S.months || {})[mk];
      if (m && m.items && m.items.length) {
        agg.rates.push(rateOf(m.items));
        agg.done += m.items.filter(x => x.done).length;
        agg.total += m.items.length;
      }
      const p = mk.split('-');
      const d = new Date(num(p[0]), num(p[1]) - 1, 1);
      d.setMonth(d.getMonth() + 1);
      mk = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    }
    const avg = agg.rates.length ? Math.round(agg.rates.reduce((a, b) => a + b, 0) / agg.rates.length) : 0;
    return '<div class="card stage-card" style="--sc:' + col + '">' +
      '<div class="card-h"><h3>' + esc(st.name) + '</h3>' +
      (cur && cur.id === st.id ? '<span class="tag" style="color:var(--star)">当前</span>' : '') +
      '<button class="icon-btn" data-act="goals-stage-edit" data-id="' + esc(st.id) + '" title="编辑">✎</button>' +
      '<button class="icon-btn" data-act="goals-stage-del" data-id="' + esc(st.id) + '" title="删除">✕</button>' +
      '</div><div class="card-b">' +
      '<div class="st-dates">' + esc(st.start) + ' ~ ' + esc(st.end) + ' · 共 ' + (diffDays(st.end, st.start) + 1) + ' 天</div>' +
      '<div class="st-goal">' + esc(st.goal || '（未填写目标）') + '</div>' +
      '<div class="st-foot"><span class="muted">' +

    '<button class="icon-btn" data-act="goals-month-del" data-id="' + esc(it.id) + '" title="删除">✕</button>' +
    '</div>').join('');
  const prevKey = _monthShift(mk, -1);
  const hasPrev = !!(S.months || {})[prevKey];
  const body =
    '<div class="row">' +
    '<button class="btn ghost sm" data-act="goals-month-nav" data-d="-1">‹ 上一月</button>' +
    '<b class="mono grow" style="text-align:center">' + num(parts[0]) + '年' + num(parts[1]) + '月</b>' +
    '<button class="btn ghost sm" data-act="goals-month-nav" data-d="1">下一月 ›</button>' +
    '</div><div class="sep"></div>' +
    (rows || empty('本月还没有计划')) +
    (!items.length && hasPrev
      ? '<div style="margin-top:8px"><button class="btn ghost sm" data-act="goals-month-copy">📋 复制自上月</button></div>' : '') +
    '<div class="sep"></div>' +
    '<div class="row"><span>条目完成 <b class="mono">' + done + '/' + items.length + '</b></span>' +
    '<span class="grow">本月任务完成率 ' + monthRate(mk + '-01') + '%</span></div>' +
    '<button class="btn primary sm" data-act="goals-month-add" style="margin-top:8px">＋ 添加月计划</button>';
  return card('🗓 月度计划', body);
}
function _monthShift(mk, n) {
  const p = mk.split('-');
  const d = new Date(num(p[0]), num(p[1]) - 1, 1);
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}

function _weekKey2date(key) {

  const y = num(p[0]);
  const wk = num(p[1]);
  const jan4 = new Date(y, 0, 4);
  const mon = new Date(jan4);
  mon.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + (wk - 1) * 7);
  return todayStr(mon);
}
Actions['goals-week-toggle'] = d => {
  const w = (S.weeks || {})[S._ui.goalWeek];
  if (!w) return;
  const it = w.items.find(x => x.id === d.id);
  if (!it) return;
  it.done = !it.done;
  save(); rerender();
};
Actions['goals-week-add'] = () => {
  const wk = S._ui.goalWeek;
  const opts = [{ v: 'all', label: '全科' }].concat(SUBJ_ORDER.map(k => ({ v: k, label: SUBJECTS[k].name })));
  Modal.form({
    title: '添加周计划（' + wk + '）',
    fields: [
      { key: 'subject', label: '学科', type: 'select', options: opts, value: 'all' },
      { key: 'text', label: '计划内容', type: 'text', required: true, placeholder: '如：完成 OS 第 3 章习题' }
    ],
    onSubmit(v) {
      if (!v.text || !v.text.trim()) { toast('内容不能为空', 'err'); return false; }
      S.weeks[wk] = S.weeks[wk] || { items: [] };
      S.weeks[wk].items.push({ id: uid(), subject: v.subject, text: v.text.trim(), done: false });
      save(); rerender();
    }
  });
};
Actions['goals-week-edit'] = d => {
  const w = (S.weeks || {})[S._ui.goalWeek];
  const it = w && w.items.find(x => x.id === d.id);
  if (!it) return;
  const opts = [{ v: 'all', label: '全科' }].concat(SUBJ_ORDER.map(k => ({ v: k, label: SUBJECTS[k].name })));
  Modal.form({
    title: '编辑周计划',
    fields: [
      { key: 'subject', label: '学科', type: 'select', options: opts, value: it.subject },
      { key: 'text', label: '计划内容', type: 'text', value: it.text, required: true }
    ],
    onSubmit(v) {
      if (!v.text || !v.text.trim()) { toast('内容不能为空', 'err'); return false; }
      it.subject = v.subject; it.text = v.text.trim();
      save(); rerender();
    }
  });
};
Actions['goals-week-del'] = d => {
  Modal.confirm({
    title: '删除周计划',
    message: '确定删除这条周计划吗？',
    onOk() {
      const w = (S.weeks || {})[S._ui.goalWeek];
      if (w) w.items = w.items.filter(x => x.id !== d.id);
      save(); rerender(); toast('已删除');
    }
  });
};
Actions['goals-week-assign'] = () => {
  const wkKey = S._ui.goalWeek || isoWeek(today());
  const w = (S.weeks || {})[wkKey];
  if (!w || !w.items.length) { toast('本周没有周计划可分配', 'err'); return; }
  const pending = w.items.filter(x => !x.done);
  if (!pending.length) { toast('周计划已全部完成，无需分配'); return; }
  const wd = weekDates(_weekKey2date(wkKey)).filter(d => d >= today());
  let note = '';
  if (!wd.length) { wd.push(today()); note = '（所选周已结束，任务加入今天）'; }
  let n = 0;
  pending.forEach((it, i) => {
    const date = wd[i % wd.length];
    S.tasks.push({ id: uid(), date: date, subject: it.subject === 'all' ? 'ds' : it.subject,
      text: '【周计划】' + it.text, done: false });
    n++;
  });
  save(); rerender();
  toast('已生成 ' + n + ' 条每日任务' + note);
};
Actions['goals-week-tpl'] = () => {
  const keys = Object.keys(WEEK_TEMPLATES);
  Modal.form({
    title: '📋 模板填充周计划',
    fields: [{
      key: 'tpl', label: '选择模板', type: 'select',
      options: keys.map(k => ({ v: k, label: k })), value: keys[0], required: true
    }],
    submitText: '填充',
    onSubmit(v) {
      const items = WEEK_TEMPLATES[v.tpl];
      if (!items || !items.length) { toast('模板内容为空', 'err'); return false; }
      S.weeks[S._ui.goalWeek] = S.weeks[S._ui.goalWeek] || { items: [] };
      items.forEach(it => {
        S.weeks[S._ui.goalWeek].items.push({ id: uid(), subject: it.subject, text: it.text, done: false });
      });
      save(); rerender();
      toast('已填充 ' + items.length + ' 条周计划');
    }
  });
};

</script>
<script>
/* =====================================================================
   研途408 · pages_b.js —— 每日打卡
   （408真题 / 算法刷题 / 错题本 / 知识点树 已按需求移除）
   ===================================================================== */

/* ======================= 每日打卡 ======================= */
registerPage('daily', {
  name: '每日打卡',
  icon: '✅',
  render(el) {
    S._ui = S._ui || {};
    const date = S._ui.dailyDate || today();
    const tasks = tasksOn(date);
    const done = tasks.filter(t => t.done).length;

    const head =
      pageHead('每日打卡', '一天一小步，日拱一卒', '') +
      card(null,
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
        '<button class="icon-btn" data-act="daily-prev">‹</button>' +
        '<span class="mono" style="font-size:16px;">' + esc(date) + ' ' + weekCN(date) + '</span>' +
        (date === today() ? '<span class="tag">今天</span>' : '') +
        '<button class="icon-btn" data-act="daily-next">›</button>' +
        '<button class="btn sm ghost" data-act="daily-today">回到今天</button>' +
        '</div>');

    // 周条
    const wd = weekDates(date);
    const strip =
      card(null,
        '<div style="display:flex;align-items:center;gap:6px;">' +
        '<button class="icon-btn" data-act="daily-week-prev" title="上一周">‹</button>' +
        '<div class="date-strip">' +
        wd.map(d => {
          const ts = tasksOn(d);
          const dn = ts.filter(t => t.done).length;
          return '<button class="ds-cell' + (d === date ? ' on' : '') + (d === today() ? ' is-today' : '') + '"' +
            ' data-act="daily-jump" data-date="' + esc(d) + '">' +
            '<span class="ds-w">' + weekCN(d) + '</span>' +
            '<span class="ds-d mono">' + d.slice(8) + '</span>' +
            '<span class="ds-c muted">' + dn + '/' + ts.length + '</span></button>';
        }).join('') +
        '</div>' +
        '<button class="icon-btn" data-act="daily-week-next" title="下一周">›</button>' +
        '</div>');

    // 添加表单
    const form =
      '<form data-submit="daily-add" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">' +
      '<input name="text" type="text" placeholder="新任务，如：过一遍红黑树" style="flex:1;min-width:180px;">' +
      '<select name="subject">' +
      SUBJ_ORDER.map(k => '<option value="' + k + '">' + esc(SUBJECTS[k].name) + '</option>').join('') +
      '</select>' +
      '<button type="submit" class="btn primary">添加</button></form>';

    // 任务列表
    let list;
    if (!tasks.length) {
      list = empty('今天还没有任务，添加一个开始吧');
    } else {
      list = '<div class="rowlist">' + tasks.map(t =>
        '<div class="row' + (t.done ? ' done' : '') + '">' +
        '<input type="checkbox" data-change="daily-toggle" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + '>' +
        subBadge(t.subject) +
        '<span class="row-text' + (t.done ? ' strike' : '') + '">' + esc(t.text) + '</span>' +
        '<button class="icon-btn" data-act="daily-edit" data-id="' + esc(t.id) + '" title="编辑">✎</button>' +
        '<button class="icon-btn" data-act="daily-del" data-id="' + esc(t.id) + '" title="删除">🗑</button>' +
        '</div>').join('') + '</div>';
    }

    const stats =
      '<div class="grid3" style="margin-top:16px;">' +
      statCard('当日完成', done + '/' + tasks.length, '', 'var(--primary)') +
      statCard('本周完成率', weekRate(date) + '%', '', 'var(--c-ds)') +
      statCard('本月完成率', monthRate(date) + '%', '', 'var(--c-math)') +
      '</div>';

    el.innerHTML = head + card(null, strip + form + list) + stats;
  }
});

Actions['daily-prev'] = () => { S._ui = S._ui || {}; S._ui.dailyDate = addDays(S._ui.dailyDate || today(), -1); rerender(); };
Actions['daily-next'] = () => { S._ui = S._ui || {}; S._ui.dailyDate = addDays(S._ui.dailyDate || today(), 1); rerender(); };
Actions['daily-today'] = () => { S._ui = S._ui || {}; S._ui.dailyDate = today(); rerender(); };
Actions['daily-jump'] = d => { S._ui = S._ui || {}; S._ui.dailyDate = d.date; rerender(); };
Actions['daily-week-prev'] = () => { S._ui = S._ui || {}; S._ui.dailyDate = addDays(S._ui.dailyDate || today(), -7); rerender(); };
Actions['daily-week-next'] = () => { S._ui = S._ui || {}; S._ui.dailyDate = addDays(S._ui.dailyDate || today(), 7); rerender(); };

Actions['daily-add'] = (d, el, ev) => {
  const vals = {};
  new FormData(ev.target).forEach((v, k) => { vals[k] = v; });
  if (!vals.text || !vals.text.trim()) { toast('任务内容不能为空', 'err'); return false; }
  S._ui = S._ui || {};
  S.tasks.push({ id: uid(), date: S._ui.dailyDate || today(), subject: vals.subject, text: vals.text.trim(), done: false });
  save(); rerender();
  return false; // 保持表单？不，rerender 后表单已重建
};

Actions['daily-toggle'] = d => {
  const t = S.tasks.find(x => x.id === d.id);
  if (!t) return;
  t.done = !t.done;
  if (t.done) t.doneAt = today(); else delete t.doneAt;
  save(); rerender();
};

Actions['daily-edit'] = d => {
  const t = S.tasks.find(x => x.id === d.id);
  if (!t) return;
  Modal.form({
    title: '编辑任务',
    fields: [
      { key: 'text', label: '任务内容', type: 'text', value: t.text, required: true },
      { key: 'subject', label: '学科', type: 'select', options: SUBJ_ORDER.map(k => ({ v: k, label: SUBJECTS[k].name })), value: t.subject },
      { key: 'date', label: '日期（可跨天）', type: 'date', value: t.date }
    ],
    onSubmit(vals) {
      if (!vals.text || !vals.text.trim()) { toast('任务内容不能为空', 'err'); return false; }
      t.text = vals.text.trim();
      t.subject = vals.subject;
      t.date = vals.date || t.date;
      save(); rerender();
    }
  });
};

Actions['daily-del'] = d => {
  const t = S.tasks.find(x => x.id === d.id);
  if (!t) return;
  Modal.confirm({
    title: '删除任务',
    message: '确定删除任务「' + esc(t.text) + '」？',
    onOk() { S.tasks = S.tasks.filter(x => x.id !== d.id); save(); rerender(); }
  });
};

Actions['quick-add-task'] = () => {
  Modal.form({
    title: '⚡ 快速添加任务',
    fields: [
      { key: 'text', label: '任务内容', type: 'text', required: true },
      { key: 'subject', label: '学科', type: 'select', options: SUBJ_ORDER.map(k => ({ v: k, label: SUBJECTS[k].name })) },
      { key: 'date', label: '日期', type: 'date', value: today() }
    ],
    onSubmit(vals) {
      if (!vals.text || !vals.text.trim()) { toast('任务内容不能为空', 'err'); return false; }
      S.tasks.push({ id: uid(), date: vals.date || today(), subject: vals.subject, text: vals.text.trim(), done: false });
      save();
      if (currentPage !== 'daily') toast('已在今天创建任务');
      rerender();
    }
  });
};

</script>
<script>
/* =====================================================================
   研途408 · pages_d.js —— 番茄计时（任务关联/白噪音/全屏沉浸/每日目标） + 数据统计
   ===================================================================== */

/* ================= 页面：番茄计时 ================= */
registerPage('pomo', {
  name: '番茄计时',
  icon: '⏱️',
  render(el) {
    S._ui = S._ui || {};
    const st = Pomo.st;
    const wk = weekDates(today());
    const mk = monthKey(today());
    const dayLog = S.pomo.log[today()] || [];
    const dayTotal = dayLog.reduce((s, x) => s + x.min, 0);

    // 模式文字 / 按钮区
    let modeTxt, btns;
    if (!st.running) {
      modeTxt = '待机 · 选择科目后开始专注';
      btns = '<button class="btn primary" data-act="pomo-start">▶ 开始专注</button>';
    } else if (!st.paused) {
      modeTxt = st.mode === 'focus' ? '专注中 · ' + (SUBJECTS[st.sub] ? esc(SUBJECTS[st.sub].name) : '') : '休息中';
      btns = '<button class="btn" data-act="pomo-pause">⏸ 暂停</button>' +
        '<button class="btn primary" data-act="pomo-stop">⏹ 结束并记录</button>' +
        '<button class="btn danger" data-act="pomo-drop">✖ 放弃(不记录)</button>';
    } else {
      modeTxt = st.mode === 'focus' ? '已暂停 · ' + (SUBJECTS[st.sub] ? esc(SUBJECTS[st.sub].name) : '') : '休息已暂停';
      btns = '<button class="btn primary" data-act="pomo-resume">▶ 继续</button>' +
        '<button class="btn" data-act="pomo-stop">⏹ 结束并记录</button>' +
        '<button class="btn danger" data-act="pomo-drop">✖ 放弃(不记录)</button>';
    }
    // 全屏 / 白噪音（待机与运行时都显示）
    btns += '<button class="btn ghost sm" data-act="pomo-fs" title="全屏沉浸专注">⛶ 全屏</button>' +
      '<button class="btn ghost sm" data-act="pomo-noise"' + (Noise.on ? ' style="border-color:var(--star);color:var(--star)"' : '') + '>🎧 白噪音</button>';

    // 准备区：待机=科目+关联任务选择；运行中=显示当前关联任务
    let prepHtml;
    if (!st.running) {
      const openTasks = tasksOn(today()).filter(t => !t.done);
      if (S._ui.pomoTaskId && !openTasks.some(t => t.id === S._ui.pomoTaskId)) S._ui.pomoTaskId = '';
      prepHtml = '<div class="pomo-sub"><label class="muted">专注科目：</label><select data-change="pomo-sub">' +
        SUBJ_ORDER.map(k => '<option value="' + k + '"' + (S.pomo.lastSub === k ? ' selected' : '') + '>' + esc(SUBJECTS[k].name) + '</option>').join('') +
        '</select><label class="muted" style="margin-left:12px">关联任务：</label><select data-change="pomo-task">' +
        '<option value="">不关联任务</option>' +
        openTasks.map(t => '<option value="' + esc(t.id) + '"' + (S._ui.pomoTaskId === t.id ? ' selected' : '') + '>' +
          esc(t.text.length > 20 ? t.text.slice(0, 20) + '…' : t.text) + '</option>').join('') +
        '</select></div>';
    } else {
      const tk = st.taskId ? S.tasks.find(t => t.id === st.taskId) : null;
      prepHtml = '<div class="pomo-sub"><label class="muted">关联任务：</label><span>' +
        (tk ? esc(tk.text) : '—') + '</span></div>';
    }

    const pct = st.running ? Math.round((1 - Pomo.remainMs() / (st.min * 60000)) * 100) : 0;

    // 今日概览卡：目标环 + 2×2 小统计
    const goalPct = clamp(Math.round(todayFocusMin() / dailyGoalMin() * 100), 0, 100);
    const todayCard = card('🎯 今日概览',
      '<div class="row" style="gap:18px;align-items:center">' +
        '<div class="ring' + (goalPct >= 100 ? ' gold' : '') + '" style="--p:' + goalPct + '">' +
          '<div class="ring-in"><b>' + goalPct + '%</b><span>今日目标</span></div></div>' +
        '<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          _pomoMini('🍅 今日番茄', todayPomoCount() + ' 个') +
          _pomoMini('🔥 连续专注', pomoStreak() + ' 天') +
          _pomoMini('今日专注', fmtMin(todayFocusMin())) +
          _pomoMini('本周专注', fmtMin(focusSum(wk[0], wk[6]))) +
        '</div></div>');

    const todayRows = dayLog.length
      ? dayLog.map(x => {
          const d = new Date(x.ts || Date.now());
          const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
          const tk = x.taskId ? S.tasks.find(t => t.id === x.taskId) : null;
          return '<div class="row-between"><span>' + subBadge(x.sub) +
            (tk ? ' <span class="tag">' + esc(tk.text.length > 12 ? tk.text.slice(0, 12) + '…' : tk.text) + '</span>' : '') +
            ' <b class="mono">' + x.min + '</b> 分钟</span><span class="muted mono">' + hm + '</span></div>';
        }).join('') + '<div class="row-between" style="border-top:1px solid var(--line);padding-top:8px;margin-top:6px"><span>今日合计</span><b class="mono">' + fmtMin(dayTotal) + '</b></div>'
      : empty('今天还没有专注记录');

    el.innerHTML = pageHead('番茄计时', '快捷键 P：开始 / 暂停 / 继续',
        '<button class="btn ghost sm" data-act="pomo-set">⚙ 番茄设置</button>') +
      '<section class="card pomo-card">' +
        '<div class="pomo-mode muted" id="pomo-mode">' + modeTxt + '</div>' +
        '<div class="big-count mono" id="pomo-display">' + (st.running ? Pomo.mmss() : S.pomo.focusMin + ':00') + '</div>' +
        '<div class="pomo-bar">' + progressBar(pct) + '</div>' +
        '<div class="pomo-btns" id="pomo-btns"><span>' + btns + '</span></div>' + prepHtml +
      '</section>' +
      '<div style="margin-top:16px">' + todayCard + '</div>' +
      '<div class="grid3" style="margin-top:16px">' +
        statCard('今日专注', fmtMin(dayTotal), dayLog.length + ' 个番茄') +
        statCard('本周专注', fmtMin(focusSum(wk[0], wk[6]))) +
        statCard('本月专注', fmtMin(focusSum(mk + '-01', today()))) +
      '</div>' +
      '<div class="grid2" style="margin-top:16px">' +
        card('近7天专注', '<canvas id="pomo-week-chart"></canvas>') +
        card('今日记录', todayRows) +
      '</div>';

    // 近7天柱状图
    try {
      const cv = document.getElementById('pomo-week-chart');
      if (cv) {
        const labels = [], data = [];
        for (let i = 6; i >= 0; i--) {
          const d = addDays(today(), -i);
          labels.push(d.slice(5));
          data.push(focusSum(d, d));
        }
        Charts.bar(cv, { labels: labels, series: [{ name: '专注分钟', color: 'var(--primary)', data: data }] });
      }
    } catch (e) { console.warn('pomo chart', e); }

    // 计时 UI 更新
    Pomo.setUI(() => {
      const dsp = document.getElementById('pomo-display');
      if (!dsp || !document.body.contains(dsp)) return;
      const ps = Pomo.st;
      if (ps.running) dsp.textContent = Pomo.mmss();
      else dsp.textContent = S.pomo.focusMin + ':00';
      const md = document.getElementById('pomo-mode');
      if (md) md.textContent = !ps.running ? '待机 · 选择科目后开始专注'
        : (ps.mode === 'focus' ? (ps.paused ? '已暂停 · ' : '专注中 · ') + (SUBJECTS[ps.sub] ? SUBJECTS[ps.sub].name : '')
           : (ps.paused ? '休息已暂停' : '休息中'));
      const p = ps.running ? Math.round((1 - Pomo.remainMs() / (ps.min * 60000)) * 100) : 0;
      const bar = dsp.closest('.pomo-card');
      const fill = bar ? bar.querySelector('.pbar i') : null;
      if (fill) fill.style.width = clamp(p, 0, 100) + '%';
      const pc = bar ? bar.querySelector('.pbar .mono') : null;
      if (pc) pc.textContent = clamp(p, 0, 100) + '%';
    });
  }
});

/* ---- 今日概览小统计格 ---- */
function _pomoMini(label, value) {
  return '<div style="padding:9px 12px;background:var(--bg3);border-radius:10px">' +
    '<div class="muted" style="font-size:11px">' + label + '</div>' +
    '<b class="mono" style="font-size:15px">' + value + '</b></div>';
}

/* ================= 全屏沉浸 overlay ================= */
let _pomoFsTimer = null;

// 按当前 Pomo.st 刷新覆盖层文本与按钮显隐（只改 textContent/style，不重设 innerHTML）
function _pomoFsSync() {
  const ov = document.getElementById('pomo-overlay');
  if (!ov) return;
  const ps = Pomo.st;
  const time = ov.querySelector('.po-time');
  if (time) time.textContent = ps.running ? Pomo.mmss() : S.pomo.focusMin + ':00';
  const mode = ov.querySelector('.po-mode');
  if (mode) {
    mode.textContent = !ps.running ? '待机 · 选择科目后开始专注'
      : (ps.mode === 'focus' ? (ps.paused ? '已暂停 · ' : '专注中 · ') + (SUBJECTS[ps.sub] ? SUBJECTS[ps.sub].name : '')
        : (ps.paused ? '休息已暂停' : '休息中'));
  }
  const vis = [
    ['pomo-pause', ps.running && !ps.paused],
    ['pomo-resume', ps.running && !!ps.paused],
    ['pomo-stop', !!ps.running]
  ];
  vis.forEach(p => {
    const b = ov.querySelector('[data-act="' + p[0] + '"]');
    if (b) b.style.display = p[1] ? '' : 'none';
  });
}

function _pomoFsBuild() {
  const ov = document.createElement('div');
  ov.id = 'pomo-overlay';
  ov.className = 'pomo-overlay';
  ov.innerHTML =
    '<div class="po-mode"></div>' +
    '<div class="po-time">00:00</div>' +
    '<div class="po-acts">' +
      '<button class="btn" data-act="pomo-pause" style="display:none">⏸ 暂停</button>' +
      '<button class="btn primary" data-act="pomo-resume" style="display:none">▶ 继续</button>' +
      '<button class="btn primary" data-act="pomo-stop" style="display:none">⏹ 结束并记录</button>' +
      '<button class="btn ghost" data-act="pomo-fs-exit">⤡ 退出全屏</button>' +
    '</div>';
  document.body.appendChild(ov);
  _pomoFsSync();
  if (_pomoFsTimer) clearInterval(_pomoFsTimer);
  _pomoFsTimer = setInterval(() => {
    if (!document.getElementById('pomo-overlay')) {
      clearInterval(_pomoFsTimer);
      _pomoFsTimer = null;
      return;
    }
    _pomoFsSync();
  }, 500);
}

function _pomoFsClose() {
  const ov = document.getElementById('pomo-overlay');
  if (ov) ov.remove();
  if (_pomoFsTimer) { clearInterval(_pomoFsTimer); _pomoFsTimer = null; }
}

// 用户按 Esc 原生退出全屏时自动收起覆盖层（顶层只注册一次）
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) _pomoFsClose();
});

/* ================= Actions：番茄计时 ================= */
Actions['pomo-start'] = () => {
  Pomo.start(S.pomo.focusMin, 'focus', S.pomo.lastSub, (S._ui && S._ui.pomoTaskId) || null);
  toast('番茄开始');
  if (currentPage === 'pomo') rerender();
};
Actions['pomo-pause'] = () => { Pomo.pause(); if (currentPage === 'pomo') rerender(); };
Actions['pomo-resume'] = () => { Pomo.resume(); if (currentPage === 'pomo') rerender(); };
Actions['pomo-stop'] = () => { Pomo.stop(true); if (currentPage === 'pomo') rerender(); };
Actions['pomo-drop'] = () => {
  Modal.confirm({
    title: '放弃番茄',
    message: '确定放弃本次专注吗？已专注时间不会记录。',
    okText: '放弃', danger: true,
    onOk: () => { Pomo.stop(false); if (currentPage === 'pomo') rerender(); }
  });
};
Actions['pomo-sub'] = (d, elCtrl) => {
  S.pomo.lastSub = elCtrl.value;
  save();
};
Actions['pomo-task'] = (d, elCtrl) => {
  S._ui = S._ui || {};
  S._ui.pomoTaskId = elCtrl.value || '';
  save();
};
Actions['pomo-noise'] = () => {
  if (Noise.on) { Noise.stop(); toast('白噪音已关闭'); }
  else if (Noise.toggle()) toast('白噪音已开启');
  if (currentPage === 'pomo') rerender();
};
Actions['pomo-fs'] = () => {
  if (document.getElementById('pomo-overlay')) return;
  _pomoFsBuild();
  try {
    const p = document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
};
Actions['pomo-fs-exit'] = () => {
  _pomoFsClose();
  if (document.fullscreenElement) {
    try {
      const p = document.exitFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
};
Actions['pomo-set'] = () => {
  Modal.form({
    title: '⚙ 番茄设置',
    fields: [
      { key: 'focusMin', label: '专注时长(分钟)', type: 'number', min: 5, max: 180, value: S.pomo.focusMin },
      { key: 'breakMin', label: '休息时长(分钟)', type: 'number', min: 1, max: 60, value: S.pomo.breakMin },
      { key: 'goal', label: '每日目标(分钟)', type: 'number', min: 10, max: 960, value: S.pomo.dailyGoalMin },
      { key: 'autoNext', label: '自动进入休息', type: 'select', options: [{ v: '1', label: '开' }, { v: '', label: '关' }], value: S.pomo.autoNext ? '1' : '' }
    ],
    onSubmit: vals => {
      const f = num(vals.focusMin, S.pomo.focusMin), b = num(vals.breakMin, S.pomo.breakMin);
      if (f < 5 || f > 180) { toast('专注时长需在 5-180 分钟之间', 'err'); return false; }
      if (b < 1 || b > 60) { toast('休息时长需在 1-60 分钟之间', 'err'); return false; }
      S.pomo.focusMin = Math.round(f);
      S.pomo.breakMin = Math.round(b);
      S.pomo.dailyGoalMin = clamp(Math.round(num(vals.goal, 240)), 10, 960);
      S.pomo.autoNext = vals.autoNext === '1';
      save();
      toast('番茄设置已保存');
      if (currentPage === 'pomo') rerender();
    }
  });
};
Actions['pomo-toggle'] = () => {
  const st = Pomo.st;
  if (!st.running) {
    Pomo.start(S.pomo.focusMin, 'focus', S.pomo.lastSub, (S._ui && S._ui.pomoTaskId) || null);
    toast('番茄开始');
  } else if (!st.paused) {
    Pomo.pause();
    toast('番茄已暂停');
  } else {
    Pomo.resume();
    toast('番茄继续');
  }
  if (currentPage === 'pomo') rerender();
};

/* ---------------- 数据统计 ---------------- */
registerPage('stats', {
  name: '数据统计',
  icon: '📈',
  render(el) {
    S._ui = S._ui || {};
    S._ui.statRange = S._ui.statRange || 'week';
    const rg = S._ui.statRange;
    const t = today();
    let dates = [];
    if (rg === 'week') dates = weekDates(t);
    else if (rg === 'd7') { for (let i = 6; i >= 0; i--) dates.push(addDays(t, -i)); }
    else if (rg === 'month') { const d0 = monthKey(t) + '-01'; const n = diffDays(t, d0); for (let i = 0; i <= n; i++) dates.push(addDays(d0, i)); }
    else { for (let i = 29; i >= 0; i--) dates.push(addDays(t, -i)); }
    const d0 = dates[0], d1 = dates[dates.length - 1];

    const totalFocus = focusSum(d0, d1);
    const avgFocus = Math.round(totalFocus / dates.length);
    let topSub = '—', topVal = 0;
    SUBJ_ORDER.forEach(k => {
      const v = focusSum(d0, d1, k);
      if (v > topVal) { topVal = v; topSub = SUBJECTS[k].name; }
    });
    const doneCnt = dates.reduce((s, d) => s + tasksOn(d).filter(x => x.done).length, 0);

    const rangeTabs = [
      { v: 'week', label: '本周' }, { v: 'd7', label: '近7天' },
      { v: 'month', label: '本月' }, { v: 'd30', label: '近30天' }
    ];

    el.innerHTML = pageHead('数据统计', '专注时长与任务完成率一览') +
      '<div style="margin-bottom:16px" class="stat-range"><label class="muted">统计范围：</label><select data-change="stat-range">' +
        rangeTabs.map(x => '<option value="' + x.v + '"' + (rg === x.v ? ' selected' : '') + '>' + x.label + '</option>').join('') +
      '</select></div>' +
      '<div class="grid-dash">' +
        statCard('区间总专注', fmtMin(totalFocus), d0 + ' ~ ' + d1) +
        statCard('日均专注', avgFocus + ' 分钟') +
        statCard('最投入科目', topSub, topVal ? fmtMin(topVal) : '') +
        statCard('区间完成任务', doneCnt + ' 项') +
      '</div>' +
      '<div class="grid2" style="margin-top:16px">' +
        card('分科专注占比', '<canvas id="stat-pie"></canvas><div style="margin-top:10px">' + Charts.legend(SUBJ_ORDER.map(k => ({
          label: SUBJECTS[k].name,
          value: focusSum(d0, d1, k),
          color: SUBJECTS[k].color
        }))) + '</div>') +
        card('每日专注时长', '<canvas id="stat-bar"></canvas>') +
      '</div>' +
      '<div class="grid2" style="margin-top:16px">' +
        card('任务完成率趋势', '<canvas id="stat-line"></canvas>') +
      '</div>' +
      '<p class="muted" style="margin-top:12px;font-size:12px">注：专注时长来自番茄钟记录，任务完成率来自每日打卡。</p>';

    try {
      const pie = document.getElementById('stat-pie');
      if (pie) Charts.pie(pie, SUBJ_ORDER.map(k => ({
        label: SUBJECTS[k].name,
        value: focusSum(d0, d1, k),
        color: SUBJECTS[k].color
      })));
    } catch (e) { console.warn('stats pie', e); }
    try {
      const bar = document.getElementById('stat-bar');
      if (bar) Charts.bar(bar, {
        labels: dates.map(d => d.slice(5)),
        series: [{ name: '分钟', color: 'var(--primary)', data: dates.map(d => focusSum(d, d)) }]
      });
    } catch (e) { console.warn('stats bar', e); }
    try {
      const line = document.getElementById('stat-line');
      if (line) Charts.line(line, {
        labels: dates.map(d => d.slice(5)),
        series: [{ name: '完成率%', color: 'var(--c-os)', data: dates.map(d => rateOf(tasksOn(d))) }]
      });
    } catch (e) { console.warn('stats line', e); }
  }
});

Actions['stat-range'] = (d, elCtrl) => {
  S._ui.statRange = elCtrl.value;
  rerender();
};

</script>
<script>
/* =====================================================================
   研途408 · pages_e.js —— 复盘中心（自动周/月复盘 + 手写总结 + 心态日记）
   ===================================================================== */

/* ---------------- 复盘：内部工具 ---------------- */
// 按 kind+period 查找已有复盘
function reviewFind(kind, period) {
  return (S.reviews || []).find(r => r.kind === kind && r.period === period) || null;
}
// text 字段四段存储：good/bad/next/feel，以 '\n---\n' 分隔
function reviewParse(text) {
  const p = String(text || '').split('\n---\n');
  return { good: p[0] || '', bad: p[1] || '', next: p[2] || '', feel: p[3] || '' };
}
const MOOD_EMOJI = { 1: '😫', 2: '😕', 3: '😐', 4: '🙂', 5: '😄' };
function moodEmoji(score) { return MOOD_EMOJI[num(score, 3)] || '😐'; }

/* ---------------- 复盘：周期数据统计 ---------------- */
// 一组日期（闭区间）内的自动数据
function revAutoStats(dates) {
  const from = dates[0], to = dates[dates.length - 1];
  const inRange = d => d >= from && d <= to;
  const tasks = [];
  dates.forEach(d => tasksOn(d).forEach(t => tasks.push(t)));
  const done = tasks.filter(t => t.done).length;
  const qCount = (S.dailyQLog || []).filter(l => inRange(l.date)).length;
  const moods = (S.moods || []).filter(m => inRange(m.date));
  const moodAvg = moods.length
    ? Math.round(moods.reduce((s, m) => s + num(m.score, 3), 0) / moods.length * 10) / 10
    : null;
  return {
    tasksTotal: tasks.length,
    tasksDone: done,
    taskRate: rateOf(tasks),
    focusMin: focusSum(from, to),
    qCount: qCount,
    moodAvg: moodAvg,
    // 每日专注分钟（小条形文字用）
    focusByDay: dates.map(d => {
      const logs = (S.pomo.log || {})[d] || [];
      return logs.reduce((s, x) => s + num(x.min, 0), 0);
    })
  };
}

/* ---------------- 复盘页 ---------------- */
registerPage('review', {
  name: '复盘中心',
  icon: '🔄',
  render(el) {
    S._ui = S._ui || {};
    const ui = S._ui;
    if (!ui.revTab) ui.revTab = 'review';
    if (!ui.revKind) ui.revKind = 'week';
    if (!ui.revWeek) ui.revWeek = isoWeek(today());
    if (!ui.revMonth) ui.revMonth = monthKey(today());

    let body = '';
    const pg = PAGES.review;
    if (ui.revTab === 'review') body = pg.renderReview();
    else body = pg.renderMood();

    el.innerHTML = pageHead('复盘中心', '定期回顾：数据自动汇总 + 手写总结，让每一步都有迹可循') +
      '<div class="tabs">' +
      '<button class="tab' + (ui.revTab === 'review' ? ' active' : '') + '" data-act="rev-tab" data-t="review">📅 周/月复盘</button>' +
      '<button class="tab' + (ui.revTab === 'mood' ? ' active' : '') + '" data-act="rev-tab" data-t="mood">💚 心态日记</button>' +
      '</div>' + body;

    if (ui.revTab === 'mood') pg.drawMoodChart();
  },

  /* ===== Tab1：周/月复盘 ===== */
  renderReview() {
    const ui = S._ui;
    const isWeek = ui.revKind === 'week';
    const nav = '<div class="row-nav">' +
      '<button class="btn sm ghost" data-act="rev-' + (isWeek ? 'prev-week' : 'prev-month') + '">‹ 上' + (isWeek ? '周' : '月') + '</button>' +
      '<span class="period-label mono">' + (isWeek ? PAGES.review.weekLabel(ui.revWeek) : PAGES.review.monthLabel(ui.revMonth)) + '</span>' +
      '<button class="btn sm ghost" data-act="rev-' + (isWeek ? 'next-week' : 'next-month') + '">下' + (isWeek ? '周' : '月') + ' ›</button>' +
      '</div>';
    const kindTabs = '<div class="tabs sub">' +
      '<button class="tab' + (isWeek ? ' active' : '') + '" data-act="rev-kind" data-k="week">周复盘</button>' +
      '<button class="tab' + (!isWeek ? ' active' : '') + '" data-act="rev-kind" data-k="month">月复盘</button>' +
      '</div>';

    const dates = isWeek ? weekDates(revWeekAnchor(ui.revWeek)) : PAGES.review.monthDates(ui.revMonth);
    const kind = isWeek ? 'week' : 'month';
    const period = isWeek ? ui.revWeek : ui.revMonth;
    const st = revAutoStats(dates);
    const exist = reviewFind(kind, period);
    const seg = reviewParse(exist && exist.text);

    const auto = '<div class="grid-dash">' +
      statCard('任务完成', st.tasksDone + '/' + st.tasksTotal, '完成率 ' + st.taskRate + '%', 'var(--primary)') +
      statCard('专注时长', fmtMin(st.focusMin), dates[0] + ' ~ ' + dates[dates.length - 1], 'var(--c-math)') +
      statCard('刷题量', String(st.qCount), '每日一题打卡', 'var(--c-ds)') +
      statCard('心态均分', st.moodAvg == null ? '—' : String(st.moodAvg), moodsCount(dates) + ' 天记录', 'var(--c-eng)') +
      '</div>' +
      card('任务完成率', progressBar(st.taskRate)) +
      card('每日专注', st.focusByDay.some(m => m > 0)
        ? '<div class="focus-days">' + dates.map((d, i) =>
            '<div class="fd-row"><span class="mono muted">' + weekCN(d) + ' ' + d.slice(5) + '</span>' +
            '<span class="mono">' + (st.focusByDay[i] > 0 ? fmtMin(st.focusByDay[i]) : '—') + '</span></div>'
          ).join('') + '</div>'
        : empty('本周还没有专注记录'));

    const form = card('手写复盘' + (exist ? '（已有记录，保存将覆盖）' : ''),
      '<form data-submit="rev-save" data-kind="' + kind + '" data-period="' + esc(period) + '">' +
      '<label class="mf-row"><span class="mf-label">做得好的</span><textarea name="good" rows="3" placeholder="哪些事做得不错？保持什么？">' + esc(seg.good) + '</textarea></label>' +
      '<label class="mf-row"><span class="mf-label">不足与问题</span><textarea name="bad" rows="3" placeholder="哪里没做好？卡在哪里？">' + esc(seg.bad) + '</textarea></label>' +
      '<label class="mf-row"><span class="mf-label">下期改进</span><textarea name="next" rows="3" placeholder="具体怎么改？">' + esc(seg.next) + '</textarea></label>' +
      '<label class="mf-row"><span class="mf-label">总体感受</span><input name="feel" type="text" value="' + esc(seg.feel) + '" placeholder="一句话总结这个' + (isWeek ? '周' : '月') + '"></label>' +
      '<div class="modal-foot"><button type="submit" class="btn primary">保存复盘</button></div>' +
      '</form>');

    return kindTabs + nav + auto + form + this.renderHistory();
  },

  weekLabel(wk) {
    const dates = weekDates(revWeekAnchor(wk));
    return wk + '（' + fmtDateCN(dates[0]) + ' ~ ' + fmtDateCN(dates[6]) + '）';
  },
  monthLabel(mk) {
    const p = mk.split('-');
    return p[0] + '年' + Number(p[1]) + '月';
  },
  // 当月 1 日 ~ 末日（未到的天截断到今天）
  monthDates(mk) {
    const p = mk.split('-');
    const y = Number(p[0]), mo = Number(p[1]);
    const last = new Date(y, mo, 0).getDate();
    const to = mk === monthKey(today()) ? Number(today().slice(8, 10)) : last;
    const out = [];
    for (let d = 1; d <= to; d++) out.push(y + '-' + pad2(mo) + '-' + pad2(d));
    return out;
  },

  renderHistory() {
    const list = (S.reviews || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (!list.length) return card('历史复盘', empty('还没有保存过复盘，写一篇吧'));
    return card('历史复盘 <span class="muted">(' + list.length + ')</span>',
      list.map(r => {
        const a = r.auto || {};
        const brief = String(r.text || '').replace(/\n---\n/g, ' / ').slice(0, 80);
        return '<div class="list-item">' +
          '<div class="li-main">' +
          '<div class="li-title"><span class="badge">' + (r.kind === 'month' ? '月' : '周') + '</span> <b class="mono">' + esc(r.period) + '</b>' +
          ' <span class="muted">' + esc(r.date || '') + '</span></div>' +
          '<div class="li-sub muted">完成 ' + num(a.tasksDone) + '/' + num(a.tasksTotal) + ' · 专注 ' + fmtMin(a.focusMin) + ' · 打卡 ' + num(a.qCount) + '</div>' +
          (brief ? '<div class="li-text muted">' + esc(brief) + '</div>' : '') +
          '</div>' +
          '<button class="icon-btn" data-act="rev-del" data-id="' + esc(r.id) + '" title="删除">🗑</button>' +
          '</div>';
      }).join(''),
      null,
      '<button class="btn sm" data-act="rev-export">导出全部复盘</button>');
  },

  /* ===== Tab2：心态日记 ===== */
  renderMood() {
    const moods = S.moods || [];
    const todayRec = moods.find(m => m.date === today()) || null;
    const avgAll = moods.length ? Math.round(moods.reduce((s, m) => s + num(m.score, 3), 0) / moods.length * 10) / 10 : '—';
    const last7 = moods.filter(m => diffDays(today(), m.date) < 7 && diffDays(today(), m.date) >= 0);
    const avg7 = last7.length ? Math.round(last7.reduce((s, m) => s + num(m.score, 3), 0) / last7.length * 10) / 10 : '—';

    const top = '<div class="grid-dash">' +
      statCard('已记录天数', String(moods.length), '坚持记录心态', 'var(--primary)') +
      statCard('平均分', String(avgAll), '全部记录', 'var(--c-math)') +
      statCard('近7天均分', String(avg7), last7.length + ' 天', 'var(--c-eng)') +
      '</div>';

    const todayCard = card('今日心态' + (todayRec ? '（今天已记录，保存将覆盖）' : ''),
      '<form data-submit="rev-mood-save">' +
      '<label class="mf-row"><span class="mf-label">状态打分</span><select name="score">' +
      [5, 4, 3, 2, 1].map(v => '<option value="' + v + '"' + (num(todayRec && todayRec.score, 3) === v ? ' selected' : '') + '>' + MOOD_EMOJI[v] + ' ' +
        ({ 1: '状态很差', 2: '有点低落', 3: '一般平静', 4: '状态不错', 5: '干劲十足' })[v] + '</option>').join('') +
      '</select></label>' +
      '<label class="mf-row"><span class="mf-label">标签</span><input name="tags" type="text" value="' + esc(todayRec && todayRec.tags) + '" placeholder="如：专注,高效,疲惫"></label>' +
      '<label class="mf-row"><span class="mf-label">今日学习状态与心情</span><textarea name="text" rows="3" placeholder="今天学得怎么样？心情如何？">' + esc(todayRec && todayRec.text) + '</textarea></label>' +
      '<div class="modal-foot"><button type="submit" class="btn primary">保存今日心态</button></div>' +
      '</form>');

    const trend = card('近 30 天心态趋势', '<canvas id="mood-chart"></canvas>');

    const sorted = moods.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 20);
    const history = card('历史记录 <span class="muted">（最近 ' + sorted.length + ' 条）</span>',
      sorted.length
        ? sorted.map(m => '<div class="list-item">' +
            '<div class="li-main">' +
            '<div class="li-title"><b class="mono">' + esc(m.date) + '</b> ' + moodEmoji(m.score) +
            ' <span class="muted">' + num(m.score) + ' 分</span></div>' +
            (m.tags ? '<div class="li-sub">' + String(m.tags).split(/[,，]/).filter(Boolean).map(t => '<span class="badge">' + esc(t.trim()) + '</span>').join(' ') + '</div>' : '') +
            '<div class="li-text muted">' + (m.text ? esc(m.text) : '—') + '</div>' +
            '</div>' +
            '<button class="icon-btn" data-act="rev-mood-del" data-date="' + esc(m.date) + '" title="删除">🗑</button>' +
            '</div>').join('')
        : empty('还没有心态记录，从今天开始吧'));

    return top + todayCard + trend + history;
  },

  drawMoodChart() {
    try {
      const cv = document.getElementById('mood-chart');
      if (!cv) return;
      const days = [];
      for (let i = 29; i >= 0; i--) days.push(addDays(today(), -i));
      const byDate = {};
      (S.moods || []).forEach(m => { byDate[m.date] = num(m.score, 3); });
      Charts.line(cv, {
        labels: days.map(d => d.slice(5)),
        series: [{ name: '心情分', color: 'var(--c-math)', data: days.map(d => byDate[d] == null ? null : byDate[d]) }],
        yMin: 1,
        yMax: 5
      }, 220);
    } catch (e) { console.warn('mood chart', e); }
  }
});

function moodsCount(dates) {
  const from = dates[0], to = dates[dates.length - 1];
  return (S.moods || []).filter(m => m.date >= from && m.date <= to).length;
}

/* ---------------- 复盘：Actions ---------------- */
Actions['rev-tab'] = d => { S._ui.revTab = d.t; rerender(); };
Actions['rev-kind'] = d => { S._ui.revKind = d.k; rerender(); };
Actions['rev-prev-week'] = () => { S._ui.revWeek = isoWeek(addDays(revWeekAnchor(S._ui.revWeek), -7)); rerender(); };
Actions['rev-next-week'] = () => { S._ui.revWeek = isoWeek(addDays(revWeekAnchor(S._ui.revWeek), 7)); rerender(); };
// 'YYYY-Www' -> 该周内的一个日期字符串（用于 weekDates / ±7 导航）
function revWeekAnchor(wk) {
  const m = /^(\d{4})-W(\d{2})$/.exec(wk || '');
  if (!m) return today();
  const y = Number(m[1]), w = Number(m[2]);
  // ISO：1月4日必在第1周，取其所在周的周一 + (w-1)*7 天
  const jan4 = weekDates(y + '-01-04');
  return addDays(jan4[0], (w - 1) * 7);
}
Actions['rev-prev-month'] = () => { S._ui.revMonth = revMonthShift(S._ui.revMonth, -1); rerender(); };
Actions['rev-next-month'] = () => { S._ui.revMonth = revMonthShift(S._ui.revMonth, 1); rerender(); };

// 'YYYY-MM' ± n 月（跨年安全）
function revMonthShift(mk, n) {
  const p = mk.split('-');
  const d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}

// 保存复盘（周/月共用）
Actions['rev-save'] = (d, el) => {
  const f = el;
  const get = k => { const x = f.querySelector('[name="' + k + '"]'); return x ? x.value.trim() : ''; };
  const kind = d.kind === 'month' ? 'month' : 'week';
  const period = d.period;
  const dates = kind === 'week' ? weekDates(revWeekAnchor(period)) : PAGES.review.monthDates(period);
  const st = revAutoStats(dates);
  const text = [get('good'), get('bad'), get('next'), get('feel')].join('\n---\n');
  const exist = reviewFind(kind, period);
  if (exist) {
    exist.auto = { tasksDone: st.tasksDone, tasksTotal: st.tasksTotal, focusMin: st.focusMin, qCount: st.qCount };
    exist.text = text;
    exist.date = today();
  } else {
    S.reviews.push({
      id: uid(), kind: kind, period: period,
      auto: { tasksDone: st.tasksDone, tasksTotal: st.tasksTotal, focusMin: st.focusMin, qCount: st.qCount },
      text: text, date: today()
    });
  }
  save(); rerender();
  toast('复盘已保存 ✓');
};

Actions['rev-del'] = d => {
  const r = (S.reviews || []).find(x => x.id === d.id);
  if (!r) return;
  Modal.confirm({
    title: '删除复盘',
    message: '确定删除 <b>' + esc(r.period) + '</b> 的' + (r.kind === 'month' ? '月' : '周') + '复盘吗？此操作不可恢复。',
    onOk() {
      S.reviews = S.reviews.filter(x => x.id !== d.id);
      save(); rerender();
      toast('已删除');
    }
  });
};

Actions['rev-export'] = () => {
  const list = (S.reviews || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (!list.length) { toast('还没有复盘记录可导出', 'err'); return; }
  const lines = ['研途408 · 复盘记录', '导出时间：' + today(), ''];
  list.forEach(r => {
    const a = r.auto || {};
    const seg = reviewParse(r.text);
    lines.push('========== ' + (r.kind === 'month' ? '【月复盘】' : '【周复盘】') + r.period + ' ==========');
    lines.push('记录日期：' + (r.date || ''));
    lines.push('任务：' + num(a.tasksDone) + '/' + num(a.tasksTotal) + ' · 专注：' + fmtMin(a.focusMin) + ' · 每日一题打卡：' + num(a.qCount));
    lines.push('【做得好的】' + (seg.good || '（空）'));
    lines.push('【不足与问题】' + (seg.bad || '（空）'));
    lines.push('【下期改进】' + (seg.next || '（空）'));
    lines.push('【总体感受】' + (seg.feel || '（空）'));
    lines.push('');
  });
  downloadText('复盘记录_' + today() + '.txt', lines.join('\n'));
  toast('已导出 ' + list.length + ' 条复盘');
};

// 保存今日心态（upsert）
Actions['rev-mood-save'] = (d, el) => {
  const get = k => { const x = el.querySelector('[name="' + k + '"]'); return x ? x.value.trim() : ''; };
  const score = clamp(Math.round(num(get('score'), 3)), 1, 5);
  const exist = (S.moods || []).find(m => m.date === today());
  if (exist) {
    exist.score = score;
    exist.tags = get('tags');
    exist.text = get('text');
  } else {
    S.moods.push({ date: today(), score: score, tags: get('tags'), text: get('text') });
  }
  save(); rerender();
  toast('今日心态已记录 ' + moodEmoji(score));
};

Actions['rev-mood-del'] = d => {
  Modal.confirm({
    title: '删除心态记录',
    message: '确定删除 <b>' + esc(d.date) + '</b> 的心态记录吗？',
    onOk() {
      S.moods = (S.moods || []).filter(m => m.date !== d.date);
      save(); rerender();
      toast('已删除');
    }
  });
};

<script>
/* =====================================================================
   研途408 · pages_f.js —— 工具箱
   作息表 / 模考成绩+趋势图 / 目标院校卡 / 资料索引 / 护眼提醒
   艾宾浩斯背诵 / 每日一题全集 / 数据管理（备份·导出·重置·快捷键）
   ===================================================================== */

/* ---------------- 本页小工具 ---------------- */
function tlTag(text, color) {
  return '<span class="tag"' + (color ? ' style="--b:' + color + '"' : '') + '>' + esc(text) + '</span>';
}
function tlDash(v) { return (v == null || String(v).trim() === '') ? '—' : esc(v); }
const TL_MOCK_TYPES = ['408', '数学', '英语', '政治'];
const TL_MOCK_COLORS = { '408': 'var(--c-net)', '数学': 'var(--c-math)', '英语': 'var(--c-eng)', '政治': 'var(--c-pol)' };
const TL_MOCK_TOTALS = { '408': 150, '数学': 150, '英语': 100, '政治': 100 };

/* =====================================================================
   页面注册
   ===================================================================== */
registerPage('tools', {
  name: '工具箱',
  icon: '🧰',
  render(el) {
    S._ui = S._ui || {};
    const tab = S._ui.tlTab || 'learn';
    const tabs = [
      ['learn', '🛠 学习工具'],
      ['recite', '🔁 背诵与刷题'],
      ['habit', '✊ 习惯打卡'],
      ['data', '💾 数据管理']
    ];
    const head = pageHead('工具箱', '作息 · 模考 · 院校 · 资料 · 背诵 · 刷题 · 数据备份');
    const tabBar = '<div class="tabs">' + tabs.map(t =>
      '<button class="tab' + (tab === t[0] ? ' active' : '') + '" data-act="tl-tab" data-tab="' + t[0] + '">' + t[1] + '</button>'
    ).join('') + '</div>';
    el.innerHTML = head + tabBar + '<div class="grid2">' +
      (tab === 'learn' ? tlLearnHtml() : tab === 'recite' ? tlReciteHtml() : tab === 'habit' ? tlHabitHtml() : tlDataHtml()) + '</div>';

    if (tab === 'learn') {
      try {
        const cv = document.getElementById('tl-mock-chart');
        if (cv) tlDrawMockChart(cv);
      } catch (e) { console.warn('mock chart', e); }
    }
  }
});

Actions['tl-tab'] = d => { S._ui.tlTab = d.tab; save(); rerender(); };

/* =====================================================================
   Tab 1：学习工具
   ===================================================================== */
function tlLearnHtml() {
  return tlSchedCard() + tlMockCard() + tlSchoolCard() + tlResCard() + tlEyeCard();
}

/* ---------- 1. 作息表 ---------- */
function tlSchedCard() {
  const list = S.schedule || [];
  const rows = list.length ? list.map(it =>
    '<div class="row">' +
      '<span class="mono">' + esc(it.start) + ' ~ ' + esc(it.end) + '</span>' +
      '<span class="grow">' + esc(it.label) + '</span>' +
      '<label class="chk"><input type="checkbox" data-change="tl-sched-remind" data-id="' + esc(it.id) + '"' + (it.remind ? ' checked' : '') + '> 提醒</label>' +
      '<button class="icon-btn" data-act="tl-sched-edit" data-id="' + esc(it.id) + '" title="编辑">✎</button>' +
      '<button class="icon-btn" data-act="tl-sched-del" data-id="' + esc(it.id) + '" title="删除">🗑</button>' +
    '</div>'
  ).join('') : empty('还没有作息时段，点「+ 添加时段」安排一天');
  return card('⏰ 作息表',
    '<p class="muted small">到点弹窗提醒需页面保持打开。</p>' +
    rows +
    '<div class="mt8"><button class="btn sm" data-act="tl-sched-add">+ 添加时段</button></div>');
}
Actions['tl-sched-add'] = () => tlSchedForm(null);
Actions['tl-sched-edit'] = d => {
  const it = (S.schedule || []).find(x => x.id === d.id);
  if (it) tlSchedForm(it);
};
function tlSchedForm(it) {
  Modal.form({
    title: it ? '编辑时段' : '添加时段',
    fields: [
      { key: 'start', label: '开始时间', type: 'time', value: it ? it.start : '08:00', required: true },
      { key: 'end', label: '结束时间', type: 'time', value: it ? it.end : '10:00', required: true },
      { key: 'label', label: '内容', type: 'text', value: it ? it.label : '', placeholder: '如：背单词 / 408网课', required: true },
      { key: 'remind', label: '到点提醒', type: 'select', options: ['开', '关'], value: it && !it.remind ? '关' : '开' }
    ],
    onSubmit(v) {
      if (!v.label.trim()) { toast('请填写内容', 'err'); return false; }
      if (it) {
        it.start = v.start; it.end = v.end; it.label = v.label.trim(); it.remind = v.remind === '开';
      } else {
        (S.schedule = S.schedule || []).push({ id: uid(), start: v.start, end: v.end, label: v.label.trim(), remind: v.remind === '开' });
      }
      save(); rerender(); toast('已保存');
    }
  });
}
Actions['tl-sched-del'] = d => {
  Modal.confirm({
    title: '删除时段',
    message: '确定删除这个作息时段吗？',
    onOk() {
      S.schedule = (S.schedule || []).filter(x => x.id !== d.id);
      save(); rerender(); toast('已删除');
    }
  });
};
Actions['tl-sched-remind'] = (d, el) => {
  const it = (S.schedule || []).find(x => x.id === d.id);
  if (it) { it.remind = el.checked; save(); }
};

/* ---------- 2. 模考成绩 ---------- */
function tlMockCard() {
  const list = (S.mocks || []).slice().sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  const rows = list.length ? list.map(m => {
    const rate = m.total ? m.score / m.total * 100 : 0;
    const color = rate >= 60 ? 'var(--ok, #6fbf73)' : rate < 45 ? 'var(--danger, #d9634f)' : '';
    return '<div class="row">' +
      tlTag(m.type, TL_MOCK_COLORS[m.type]) +
      '<span class="mono">' + esc(m.date) + '</span>' +
      '<span class="mono"' + (color ? ' style="color:' + color + ';font-weight:700"' : '') + '>' + esc(m.score) + ' / ' + esc(m.total) + '</span>' +
      '<span class="grow muted">' + tlDash(m.note) + '</span>' +
      '<button class="icon-btn" data-act="tl-mock-del" data-id="' + esc(m.id) + '" title="删除">🗑</button>' +
    '</div>';
  }).join('') : empty('还没有模考记录，考完一套就记一笔');
  return card('📝 模考成绩',
    rows +
    '<div class="mt8"><button class="btn sm" data-act="tl-mock-add">+ 记录模考</button></div>' +
    '<div class="mt12"><canvas id="tl-mock-chart"></canvas></div>' +
    Charts.legend(TL_MOCK_TYPES.map(t => ({ label: t, value: (S.mocks || []).filter(m => m.type === t).length, color: TL_MOCK_COLORS[t] }))));
}
Actions['tl-mock-add'] = () => {
  Modal.form({
    title: '记录模考',
    fields: [
      { key: 'date', label: '日期', type: 'date', value: today(), required: true },
      { key: 'type', label: '科目', type: 'select', options: TL_MOCK_TYPES, value: '408' },
      { key: 'score', label: '得分', type: 'number', value: '', required: true },
      { key: 'total', label: '总分', type: 'number', value: '', placeholder: '408/数学 150，英语/政治 100' },
      { key: 'note', label: '备注', type: 'text', value: '', placeholder: '如：卡在操作系统大题' }
    ],
    onSubmit(v) {
      const type = TL_MOCK_TYPES.indexOf(v.type) >= 0 ? v.type : '408';
      const total = v.total.trim() !== '' ? Math.round(num(v.total)) : (TL_MOCK_TOTALS[type] || 150);
      if (v.score.trim() === '') { toast('请填写得分', 'err'); return false; }
      (S.mocks = S.mocks || []).push({ id: uid(), date: v.date, type: type, score: Math.round(num(v.score)), total: total, note: v.note.trim() });
      save(); rerender(); toast('已记录模考');
    }
  });
};
Actions['tl-mock-del'] = d => {
  Modal.confirm({
    title: '删除模考记录',
    message: '确定删除这条模考记录吗？',
    onOk() {
      S.mocks = (S.mocks || []).filter(x => x.id !== d.id);
      save(); rerender(); toast('已删除');
    }
  });
};
function tlDrawMockChart(cv) {
  const mocks = (S.mocks || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const dates = [];
  mocks.forEach(m => { if (dates.indexOf(m.date) < 0) dates.push(m.date); });
  Charts.line(cv, {
    labels: dates.map(d => d.slice(5)),
    series: TL_MOCK_TYPES.map(t => ({
      name: t,
      color: TL_MOCK_COLORS[t],
      data: dates.map(d => {
        const m = mocks.find(x => x.date === d && x.type === t);
        return m ? m.score : null;
      })
    }))
  }, 240);
}

/* ---------- 3. 目标院校 ---------- */
function tlSchoolCard() {
  const sc = S.school || {};
  const lines = sc.lines || [];
  const lineRows = lines.length ? lines.map((l, i) =>
    '<tr><td class="mono">' + tlDash(l.year) + '</td><td class="mono"><b>' + tlDash(l.score) + '</b></td><td class="muted">' + tlDash(l.note) + '</td>' +
    '<td><button class="icon-btn" data-act="tl-line-del" data-i="' + i + '" title="删除">🗑</button></td></tr>'
  ).join('') : '<tr><td colspan="4" class="muted">暂无分数线记录</td></tr>';
  return card('🎓 目标院校',
    '<div class="school-card">' +
      '<div class="sc-name">' + tlDash(sc.name) + '</div>' +
      '<div class="muted">' + tlDash(sc.major) + (sc.province ? ' · ' + esc(sc.province) : '') + '</div>' +
      '<div class="sc-meta mt8">' +
        '<span>报录比 <b class="mono">' + tlDash(sc.ratio) + '</b></span>' +
        '<span>招生 <b class="mono">' + tlDash(sc.enroll) + '</b> 人</span>' +
        '<span>复试 <b>' + tlDash(sc.retest) + '</b></span>' +
      '</div>' +
      (sc.books ? '<div class="mt8 small"><span class="muted">参考书目：</span>' + esc(sc.books).replace(/\n/g, '<br>') + '</div>' : '') +
      (sc.note ? '<div class="mt8 small muted">' + esc(sc.note) + '</div>' : '') +
      '<div class="mt12"><button class="btn sm" data-act="tl-school-edit">✎ 编辑院校信息</button></div>' +
    '</div>' +
    '<div class="mt12"><h4>历年分数线</h4>' +
    '<table class="tbl"><thead><tr><th>年份</th><th>分数</th><th>备注</th><th></th></tr></thead><tbody>' + lineRows + '</tbody></table>' +
    '<div class="mt8"><button class="btn sm ghost" data-act="tl-line-add">+ 添加分数线</button></div></div>');
}
Actions['tl-school-edit'] = () => {

      { key: 'major', label: '报考专业', type: 'text', value: sc.major || '', placeholder: '如：计算机科学与技术' },
      { key: 'province', label: '省份', type: 'text', value: sc.province || '' },
      { key: 'ratio', label: '报录比', type: 'text', value: sc.ratio || '', placeholder: '如 10:1' },
      { key: 'enroll', label: '招生人数', type: 'text', value: sc.enroll || '' },
      { key: 'retest', label: '复试科目', type: 'text', value: sc.retest || '' },
      { key: 'books', label: '参考书目', type: 'textarea', value: sc.books || '', rows: 4, placeholder: '每行一本' },
      { key: 'note', label: '备注', type: 'textarea', value: sc.note || '', rows: 2 }
    ],
    onSubmit(v) {
      S.school = Object.assign({}, S.school, {
        name: v.name.trim(), major: v.major.trim(), province: v.province.trim(),

      });

};
Actions['tl-line-add'] = () => {
  Modal.form({
    title: '添加分数线',
    fields: [
      { key: 'year', label: '年份', type: 'number', required: true, min: 2000, max: 2100 },
      { key: 'score', label: '分数线', type: 'number', required: true },
      { key: 'note', label: '备注', type: 'text', placeholder: '如：校线 / 院线' }
    ],
    onSubmit(v) {
      S.school = S.school || { lines: [] };
      if (!Array.isArray(S.school.lines)) S.school.lines = [];
      S.school.lines.push({ year: Math.round(num(v.year)), score: Math.round(num(v.score)), note: v.note.trim() });
      save(); rerender(); toast('已添加');
    }
  });
};
Actions['tl-line-del'] = d => {
  S.school = S.school || { lines: [] };
  if (!Array.isArray(S.school.lines)) S.school.lines = [];
  Modal.confirm({
    title: '删除分数线',
    message: '确定删除这条分数线记录吗？',
    onOk() {
      S.school.lines.splice(num(d.i), 1);
      save(); rerender(); toast('已删除');
    }
  });
};

/* ---------- 4. 资料索引 ---------- */
function tlFilteredResources() {
  const q = (S._ui.tlResSearch || '').trim().toLowerCase();
  const sub = S._ui.tlResSubj || 'all';
  const type = S._ui.tlResType || 'all';
  return (S.resources || []).filter(r =>
    (sub === 'all' || r.subject === sub) &&
    (type === 'all' || r.type === type) &&
    (!q || (r.name || '').toLowerCase().indexOf(q) >= 0 || (r.loc || '').toLowerCase().indexOf(q) >= 0 || (r.note || '').toLowerCase().indexOf(q) >= 0)
  );
}
const TL_RES_TYPES = ['网课', '讲义', '真题', '笔记', '其他'];
function tlResCard() {
  const all = S.resources || [];
  const list = tlFilteredResources();

    '<option value="' + k + '"' + ((S._ui.tlResSubj || 'all') === k ? ' selected' : '') + '>' + esc(SUBJECTS[k].name) + '</option>')).join('');
  const typeOpts = ['<option value="all">全部</option>'].concat(TL_RES_TYPES.map(t =>
    '<option value="' + t + '"' + ((S._ui.tlResType || 'all') === t ? ' selected' : '') + '>' + esc(t) + '</option>')).join('');
  const rows = list.length ? list.map(r =>
    '<div class="row' + (r.done ? ' done-row' : '') + '">' +

      '<span class="grow">' + esc(r.name) + (r.loc ? ' <span class="muted small">📍' + esc(r.loc) + '</span>' : '') + '</span>' +

  ).join('') : (all.length ? empty('没有符合筛选条件的资料') : empty('还没有资料，把网课/讲义/真题都登记进来'));

    '<div class="filter-bar">' +
      '<input type="search" placeholder="搜索名称/位置…" value="' + esc(S._ui.tlResSearch || '') + '" data-input="tl-res-search">' +
      '<select data-change="tl-res-subj">' + subOpts + '</select>' +
      '<select data-change="tl-res-type">' + typeOpts + '</select>' +
      '<span class="muted small">共 ' + all.length + ' 项</span>' +
    '</div>' +
    rows +
    '<div class="mt8"><button class="btn sm" data-act="tl-res-add">+ 添加资料</button></div>');
}
Actions['tl-res-search'] = (d, el) => {
  const pos = el.selectionStart;

Actions['tl-res-type'] = (d, el) => { S._ui.tlResType = el.value; tlResListRerender(); };

  Modal.form({
    title: '添加资料',
    wide: true,

/* ---------- 6. 艾宾浩斯背诵计划 ---------- */
function tlMemCard() {
  const items = S.memItems || [];
  const t = today();
  const dueCnt = typeof dueMemItems === 'function' ? dueMemItems().length : 0;
  const sorted = items.slice().sort((a, b) => {
    const na = tlMemNextDate(a), nb = tlMemNextDate(b);
    if (na === nb) return 0;
    if (na === null) return 1;
    if (nb === null) return -1;
    return na < nb ? -1 : 1;
  });
  const rows = sorted.length ? sorted.map(it => {
    const nd = tlMemNextDate(it);
    const doneCnt = (it.reviews || []).filter(r => r.done).length;
    let dueHtml;
    if (!nd) dueHtml = '<span class="muted">已全部完成 🎉</span>';
    else if (nd === t) dueHtml = '<span style="color:var(--warn,#e0a13c);font-weight:700">今天</span>';
    else if (nd < t) dueHtml = '<span class="due">逾期 ' + diffDays(t, nd) + ' 天</span>';
    else dueHtml = '<span class="muted">' + esc(nd.slice(5)) + '</span>';
    const content = (it.content || '').replace(/\s+/g, ' ').trim();
    return '<div class="row">' +
      '<b>' + esc(it.name) + '</b>' + subBadge(it.subject) +
      '<span class="grow muted small">' + esc(content.slice(0, 40)) + (content.length > 40 ? '…' : '') + '</span>' +
      '<span class="small">已完成 ' + doneCnt + '/6</span>' + dueHtml +
      '<button class="btn sm" data-act="tl-mem-ok" data-id="' + esc(it.id) + '">✓ 记住了</button>' +
      '<button class="btn sm ghost" data-act="tl-mem-later" data-id="' + esc(it.id) + '">✗ 明天再说</button>' +
      '<button class="icon-btn" data-act="tl-mem-del" data-id="' + esc(it.id) + '" title="删除">🗑</button>' +
    '</div>';
  }).join('') : empty('还没有背诵项，新增一个开始艾宾浩斯记忆');
  return card('🧠 艾宾浩斯背诵计划',
    '<p class="muted small">按 1/2/4/7/15/30 天间隔安排复习，今日到期（含逾期）<b>' + dueCnt + '</b> 项。</p>' +
    rows +
    '<div class="mt8"><button class="btn sm" data-act="tl-mem-add">+ 新增背诵项</button></div>');
}
function tlMemNextDate(it) {
  const pend = (it.reviews || []).filter(r => !r.done);
  if (!pend.length) return null;
  return pend.map(r => r.date).sort()[0];
}
Actions['tl-mem-add'] = () => {
  Modal.form({
    title: '新增背诵项',
    wide: true,
    fields: [
      { key: 'name', label: '名称', type: 'text', required: true, placeholder: '如：数据结构-排序算法总结' },
      { key: 'subject', label: '科目', type: 'select', options: SUBJ_ORDER.map(k => ({ v: k, label: SUBJECTS[k].name })), value: 'ds' },
      { key: 'content', label: '背诵内容', type: 'textarea', rows: 5, placeholder: '粘贴要背的要点…' },
      { key: 'start', label: '开始日期', type: 'date', value: today(), required: true }
    ],
    onSubmit(v) {
      if (!v.name.trim()) { toast('请填写名称', 'err'); return false; }
      (S.memItems = S.memItems || []).push({
        id: uid(), name: v.name.trim(), subject: SUBJECTS[v.subject] ? v.subject : 'ds',
        content: v.content.trim(), date: v.start || today(),
        reviews: [1, 2, 4, 7, 15, 30].map(n => ({ date: addDays(v.start || today(), n), done: false }))
      });

/* ---------- 7. 每日一题 ---------- */
function tlDailyQCard() {
  const t = today();
  const q = typeof todayQuestion === 'function' ? todayQuestion() : null;
  const log = S.dailyQLog || [];
  const todayLog = q ? log.find(l => l.date === t && l.qid === q.id) : null;
  let qHtml;
  if (!q) {
    qHtml = empty('题库为空，无法出题');
  } else {
    const letters = ['A', 'B', 'C', 'D'];
    if (todayLog) {
      qHtml = '<div class="q-head">' + subBadge(q.subject) + '<span class="mono muted">' + esc(t) + '</span>' +
        '<span class="tag">' + (todayLog.correct ? '✓ 已答对' : '✗ 已答错') + '</span></div>' +
        '<p class="q-text">' + esc(q.q) + '</p>' +
        q.options.map((o, i) => {
          const letter = letters[i];
          const isAns = letter === q.answer;
          const isPick = letter === todayLog.choice;
          let cls = 'q-opt';
          if (isAns) cls += ' right';
          else if (isPick) cls += ' wrong';
          return '<button class="' + cls + '" disabled>' +
            '<b>' + letter + '</b> ' + esc(o) +
            (isAns ? ' <span class="muted small">← 答案 ' + esc(q.answer) + '</span>' : isPick ? ' <span class="muted small">← 你的选择</span>' : '') +
          '</button>';
        }).join('') +
        '<div class="q-explain"><b>解析</b>' + esc(q.explain || '暂无解析') + '</div>';
    } else {
      qHtml = '<div class="q-head">' + subBadge(q.subject) + '<span class="mono muted">' + esc(t) + '</span></div>' +
        '<p class="q-text">' + esc(q.q) + '</p>' +
        q.options.map((o, i) =>
          '<button class="q-opt" data-act="tl-q-answer" data-k="' + letters[i] + '"><b>' + letters[i] + '</b> ' + esc(o) + '</button>'
        ).join('');
    }
  }
  const hist = log.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0).slice(0, 15);
  const bank = S.dailyQBank || [];
  const histRows = hist.length ? hist.map(l => {
    const q2 = bank.find(x => x.id === l.qid);
    return '<div class="row">' +
      '<span class="mono muted">' + esc(l.date) + '</span>' +
      (l.correct ? '<span style="color:var(--ok,#6fbf73)">✓</span>' : '<span style="color:var(--danger,#d9634f)">✗</span>') +
      '<span class="grow small">' + esc(q2 ? (q2.q || '').slice(0, 30) + ((q2.q || '').length > 30 ? '…' : '') : '题目已更新') + '</span>' +
      '<span class="small muted">答案 ' + esc(q2 ? q2.answer : (l.choice || '—')) + '</span>' +
    '</div>';
  }).join('') : empty('还没有答题记录');
  const days = (function () { const seen = {}; log.forEach(l => { seen[l.date] = 1; }); return Object.keys(seen).length; })();
  const correct = log.filter(l => l.correct).length;
  const rate = log.length ? Math.round(correct / log.length * 100) : 0;
  return card('❓ 每日一题',
    qHtml +
    '<div class="mt12"><h4>答题历史</h4>' +
    '<p class="muted small">已打卡 <b>' + days + '</b> 天 · 正确率 <b>' + rate + '%</b>（' + correct + '/' + log.length + '）</p>' +
    histRows + '</div>');
}
Actions['tl-q-answer'] = d => {
  const t = today();
  const q = typeof todayQuestion === 'function' ? todayQuestion() : null;
  if (!q) return;
  if ((S.dailyQLog || []).some(l => l.date === t && l.qid === q.id)) { toast('今天已经答过了', 'err'); rerender(); return; }
  const correct = d.k === q.answer;
  (S.dailyQLog = S.dailyQLog || []).push({ date: t, qid: q.id, choice: d.k, correct: correct });
  save();
  toast(correct ? '回答正确，稳！' : '答错了，看看解析', correct ? 'ok' : 'err');
  rerender();
};

function tlBackupCard() {
  return card('💾 备份与恢复',

    '<div class="row mt8">' +

    '</div>' +
    '<div class="mt12">' +
      '<label class="btn sm" style="cursor:pointer">⬆ 从 JSON 恢复' +
        '<input type="file" accept=".json,application/json" data-change="tl-import" style="display:none">' +
      '</label>' +
      ' <button class="btn sm" data-act="tl-restore-bak">↩ 从 .bak 备份恢复</button>' +
      '<p class="muted small mt8">.bak 是每次导入/恢复前自动留存的上一份数据，可在此一键回滚。</p>' +
    '</div>');
}
Actions['tl-export-json'] = () => {
  downloadText('研途408_备份_' + today() + '.json', JSON.stringify(S, null, 2));
  toast('备份已导出');
};
Actions['tl-import'] = (d, el) => {
  const file = el.files && el.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj = null;
    try { obj = JSON.parse(String(reader.result)); } catch (e) { obj = null; }
    const NEED_ARR = ['tasks', 'milestones', 'realExam', 'algo', 'pitfalls', 'mathErrors', 'memItems',
      'dailyQLog', 'mocks', 'resources', 'reviews', 'moods', 'keyNodes', 'stages', 'schedule'];
    const bad = !obj || typeof obj !== 'object' || Array.isArray(obj) || obj.version == null ||
      !Array.isArray(obj.tasks) ||
      NEED_ARR.some(k => obj[k] !== undefined && !Array.isArray(obj[k]));
    if (bad) {
      toast('文件格式不正确或核心数据已损坏，导入失败', 'err');
      el.value = '';
      return;
    }
    Modal.confirm({
      title: '⚠ 导入将覆盖现有数据',
      message: '导入后<b>当前全部数据会被覆盖</b>（覆盖前会自动留存一份 .bak 备份）。<br>确定继续吗？',
      okText: '覆盖导入',
      onOk() {
        try {
          const cur = localStorage.getItem(DB_KEY);
          if (cur) localStorage.setItem(DB_KEY + '.bak', cur);
          DB.s = obj;
          S = DB.s;
          migrate(S);
          save();
          rerender();
          toast('导入成功，数据已恢复');
        } catch (e) {
          toast('导入失败：' + e.message, 'err');
        }
      }
    });
  };
  reader.onerror = () => toast('读取文件失败', 'err');
  reader.readAsText(file);
};
Actions['tl-restore-bak'] = () => {
  const raw = localStorage.getItem(DB_KEY + '.bak');
  if (!raw) { toast('还没有 .bak 备份（导入/恢复时会自动生成）', 'err'); return; }
  let obj = null;
  try { obj = JSON.parse(raw); } catch (e) { obj = null; }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { toast('.bak 备份已损坏，无法恢复', 'err'); return; }
  Modal.confirm({
    title: '↩ 从 .bak 备份恢复',
    message: '当前数据将被 <b>.bak 备份</b>覆盖（覆盖前当前状态会另存为新的 .bak）。确定继续吗？',
    okText: '恢复',
    onOk() {
      try {
        const cur = localStorage.getItem(DB_KEY);
        if (cur) localStorage.setItem(DB_KEY + '.bak', cur);
        DB.s = obj;
        S = DB.s;
        migrate(S);
        save(); rerender();
        toast('已从 .bak 备份恢复');
      } catch (e) { toast('恢复失败：' + e.message, 'err'); }
    }
  });
};

  Modal.confirm({
    title: '⚠⚠ 重置全部数据',
    message: '<b style="color:var(--danger,#d9634f)">此操作不可恢复！</b><br>所有任务、笔记、复盘、计时记录都会被清空。<br>强烈建议先「导出全部数据(JSON)」留一份备份。<br>确定要重置吗？',
    okText: '全部重置',
    onOk() {
      try { localStorage.removeItem(DB_KEY); } catch (e) {}
      location.reload();
    }
  });
};

/* ---------- 8d. 快捷键说明 ---------- */
function tlHotkeyCard() {
  const kbd = k => '<kbd>' + k + '</kbd>';
  return card('⌨ 快捷键',
    '<div class="row"><span>' + kbd('N') + '</span><span class="grow">新增任务</span></div>' +
    '<div class="row"><span>' + kbd('P') + '</span><span class="grow">番茄开始 / 暂停</span></div>' +
    '<div class="row"><span>' + kbd('T') + '</span><span class="grow">切换主题</span></div>' +
    '<div class="row"><span>' + kbd('Esc') + '</span><span class="grow">关闭弹窗</span></div>');
}

</script>
